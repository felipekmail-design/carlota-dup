<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carlota">
<title>Carlota · Sauber</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans',sans-serif;color:#111;background:#ebebeb;}

/* ── APP SHELL ── */
.app{max-width:480px;margin:0 auto;min-height:100vh;background:#ebebeb;}

/* ── PROFILE BAR ── */
.profile-bar{display:grid;grid-template-columns:1fr 1fr;background:#0a0a0a;}
.profile-btn{padding:13px;border:none;background:transparent;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:4px;color:#333;cursor:pointer;transition:all .2s;border-bottom:3px solid transparent;-webkit-appearance:none;touch-action:manipulation;}
.profile-btn.active-fk{color:#fff;border-bottom-color:#F59300;background:rgba(245,147,0,0.08);}
.profile-btn.active-jrv{color:#fff;border-bottom-color:#00C8FF;background:rgba(0,200,255,0.08);}

/* ── HEADER ── */
.header{padding:0 18px;position:sticky;top:0;z-index:100;background:#111;}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:12px 0 6px;}
.logo-wrap{display:flex;flex-direction:column;gap:1px;}
.logo-sub{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:3px;color:#444;text-transform:uppercase;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:5px;color:#fff;line-height:1;}
.logo-sep{color:#444;font-size:16px;letter-spacing:2px;}
.logo-ver{color:#888;}
.sync-badge{display:flex;align-items:center;gap:5px;font-family:'DM Mono',monospace;font-size:9px;color:#555;letter-spacing:1px;text-transform:uppercase;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#10b981;animation:pulse 2s infinite;flex-shrink:0;}
.sync-dot.syncing{background:#fbbf24;animation:spin 1s linear infinite;}
.sync-dot.error{background:#ef4444;animation:none;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── TABS ── */
.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding-bottom:0;border-top:1px solid #1a1a1a;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:9px 12px;font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:1.5px;cursor:pointer;border:none;background:transparent;color:#444;border-bottom:2px solid transparent;transition:all .2s;text-transform:uppercase;-webkit-appearance:none;touch-action:manipulation;}
.tab.active-fk{color:#F59300;border-bottom-color:#F59300;}
.tab.active-jrv{color:#00C8FF;border-bottom-color:#00C8FF;}

/* ── PAGES ── */
.page{padding:18px;display:none;background:#ebebeb;min-height:calc(100vh - 120px);}
.page.active{display:block;}

/* ── SECTION LABEL ── */
.sec-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;color:#aaa;text-transform:uppercase;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid #ddddd6;}

/* ── PROFILE BADGE ── */
.profile-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;}
.badge-fk{background:rgba(245,147,0,0.08);color:#F59300;border:1px solid rgba(245,147,0,0.25);}
.badge-jrv{background:rgba(0,200,255,0.08);color:#00C8FF;border:1px solid rgba(0,200,255,0.25);}

/* ── WORKOUT PAGE ── */
.wk-title{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:4px;line-height:1;color:#111;margin-bottom:3px;}
.wk-sub{font-size:12px;color:#888;margin-bottom:12px;}
.zone-badge{display:inline-flex;align-items:center;padding:5px 12px;border-radius:5px;font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:2px;text-transform:uppercase;background:var(--ac);color:#fff;margin-bottom:14px;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:18px;}
.stat{background:#fff;border:1px solid #e0e0d8;border-radius:10px;padding:10px 6px;text-align:center;}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--ac);display:block;line-height:1.1;}
.stat-lbl{font-family:'DM Mono',monospace;font-size:8px;color:#bbb;letter-spacing:2px;text-transform:uppercase;margin-top:2px;}

/* ── LAST WORKOUT REF ── */
.last-ref{background:#fff;border:1px solid #e0e0d8;border-left:3px solid var(--ac);border-radius:0 10px 10px 0;padding:10px 12px;margin-bottom:14px;}
.last-ref-lbl{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:2px;color:#bbb;text-transform:uppercase;margin-bottom:3px;}
.last-ref-txt{font-size:11px;color:#666;line-height:1.5;}
.last-ref-date{font-family:'DM Mono',monospace;font-size:9px;color:var(--ac);font-weight:500;margin-left:4px;}

/* ── EXERCISE CARDS ── */
.ex-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.ex-card{background:#fff;border:1px solid #e0e0d8;border-radius:12px;overflow:hidden;}
.ex-card.has-alert{border-left:3px solid #f59e0b;}
.ex-card.is-primary{border-left:3px solid var(--ac);}
.ex-toggle{width:100%;text-align:left;background:transparent;border:none;padding:12px 14px 10px;cursor:pointer;display:block;-webkit-appearance:none;touch-action:manipulation;}
.ex-toggle:active{background:rgba(0,0,0,0.02);}
.ex-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.ex-num{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:2px;color:#bbb;margin-bottom:3px;display:block;}
.ex-name{font-size:13px;font-weight:600;color:#111;margin-bottom:6px;line-height:1.3;display:block;}
.chips{display:flex;gap:5px;flex-wrap:wrap;}
.chip{font-family:'DM Mono',monospace;font-size:9px;padding:3px 7px;border-radius:4px;background:#f0f0ec;color:#666;border:1px solid #e0e0d8;}
.chip.z{background:var(--ac);color:#fff;border-color:var(--ac);}
.arrow{flex-shrink:0;width:26px;height:26px;background:#f0f0ec;border:1px solid #e0e0d8;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#999;font-size:10px;margin-top:2px;pointer-events:none;}
.ex-note{font-size:10px;color:#777;line-height:1.5;margin-top:6px;display:block;text-align:left;}
.alert-row{display:flex;gap:5px;margin-top:6px;padding:6px 9px;background:#fffbeb;border-radius:5px;border:1px solid #fcd34d;font-size:10px;color:#92400e;font-weight:500;line-height:1.4;text-align:left;}

/* ── LOG BODY ── */
.log-body{border-top:1px solid #eeeee6;padding:12px 14px 14px;background:#f8f8f4;display:none;}
.log-body.open{display:block;}
.prev-ref{background:#fef9c3;border:1px solid #fde68a;border-radius:6px;padding:7px 9px;margin-bottom:8px;}
.prev-ref-lbl{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:2px;color:#a16207;text-transform:uppercase;margin-bottom:3px;}
.prev-ref-txt{font-size:10px;color:#854d0e;line-height:1.5;font-family:'DM Mono',monospace;}
.log-cols{display:grid;grid-template-columns:24px 1fr 1fr 36px;gap:5px;margin-bottom:6px;}
.col-h{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:2px;color:#bbb;text-transform:uppercase;text-align:center;}
.set-row{display:grid;grid-template-columns:24px 1fr 1fr 36px;gap:5px;margin-bottom:5px;align-items:center;}
.set-n{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--ac);text-align:center;opacity:.6;}
.inp{background:#fff;border:1.5px solid #e0e0d8;border-radius:7px;padding:10px 4px;font-family:'DM Mono',monospace;font-size:14px;color:#111;width:100%;text-align:center;outline:none;-webkit-appearance:none;font-weight:500;transition:border-color .2s;}
.inp:focus{border-color:var(--ac);}
.inp::placeholder{color:#ccc;font-size:10px;font-weight:400;}
.inp.faded{opacity:.35;}
.ok-btn{width:36px;height:40px;border-radius:7px;border:1.5px solid #e0e0d8;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:#ccc;transition:all .2s;-webkit-appearance:none;touch-action:manipulation;}
.ok-btn.done{background:var(--ac);border-color:var(--ac);color:#fff;}
.obs{width:100%;margin-top:8px;background:#fff;border:1.5px solid #e0e0d8;border-radius:7px;padding:9px 11px;font-family:'DM Sans',sans-serif;font-size:12px;color:#444;resize:none;outline:none;height:46px;-webkit-appearance:none;}
.obs::placeholder{color:#ccc;}
.clear-btn{margin-top:7px;width:100%;padding:8px;background:transparent;border:1px solid #e0e0d8;border-radius:7px;font-family:'DM Mono',monospace;font-size:8px;color:#bbb;letter-spacing:1px;cursor:pointer;-webkit-appearance:none;touch-action:manipulation;}

/* ── SAVE BUTTON ── */
.send-wrap{margin-bottom:20px;}
.save-btn{width:100%;padding:15px;border:none;border-radius:12px;font-family:'DM Mono',monospace;font-size:11px;font-weight:500;letter-spacing:2px;color:#fff;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;-webkit-appearance:none;touch-action:manipulation;background:#111;transition:all .2s;}
.save-btn:active{opacity:.85;transform:scale(.98);}
.save-btn.saving{background:#fbbf24;}
.save-btn.saved{background:#10b981;}
.send-note{text-align:center;margin-top:7px;font-size:10px;color:#aaa;line-height:1.5;}

/* ── SCI + TIP ── */
.sci-box{background:#f0f4ff;border:1px solid #c7d8fb;border-radius:10px;padding:12px 14px;margin-bottom:12px;}
.sci-lbl{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:3px;color:#3b82f6;text-transform:uppercase;margin-bottom:5px;}
.sci-txt{font-size:11px;color:#2c5282;line-height:1.6;}
.tip-box{background:#fff;border:1px solid #e0e0d8;border-radius:10px;padding:12px 14px;margin-bottom:24px;}
.tip-lbl{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:3px;color:var(--ac);text-transform:uppercase;margin-bottom:5px;}
.tip-txt{font-size:11px;color:#666;line-height:1.6;}

/* ── HISTORY PAGE ── */
.page-title{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:4px;color:#111;line-height:1;margin-bottom:3px;}
.page-sub{font-size:12px;color:#888;margin-bottom:18px;}
.hist-item{background:#fff;border:1px solid #e0e0d8;border-radius:12px;margin-bottom:8px;overflow:hidden;border-left:3px solid var(--ac);}
.hist-head{padding:11px 13px;cursor:pointer;width:100%;text-align:left;background:transparent;border:none;-webkit-appearance:none;touch-action:manipulation;}
.hist-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.hist-wk{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:#111;line-height:1;}
.hist-dt{font-family:'DM Mono',monospace;font-size:9px;color:#888;text-align:right;}
.hist-meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
.hist-chip{font-family:'DM Mono',monospace;font-size:8px;padding:2px 6px;border-radius:4px;background:#f0f0ec;color:#666;border:1px solid #e0e0d8;}
.hist-chip.z{background:var(--ac);color:#fff;border-color:var(--ac);}
.hist-body{padding:0 13px 13px;display:none;border-top:1px solid #f0f0e8;}
.hist-body.open{display:block;padding-top:10px;}
.hist-ex{margin-bottom:10px;}
.hist-ex-name{font-size:11px;font-weight:600;color:#111;margin-bottom:3px;}
.hist-set{font-family:'DM Mono',monospace;font-size:10px;color:#555;line-height:1.6;}
.hist-obs{font-size:10px;color:#888;font-style:italic;margin-top:3px;}
.hist-del{width:100%;margin-top:8px;padding:7px;background:transparent;border:1px solid #fca5a5;border-radius:6px;font-family:'DM Mono',monospace;font-size:8px;color:#ef4444;letter-spacing:1px;cursor:pointer;-webkit-appearance:none;}
.empty{text-align:center;padding:36px 18px;color:#bbb;font-size:12px;line-height:1.7;background:#fff;border:1px solid #e0e0d8;border-radius:12px;}

/* ── PROG PAGE ── */
.hk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:12px;}
.hk-card{background:#fff;border:1px solid #e0e0d8;border-radius:10px;padding:12px 10px;text-align:center;}
.hk-card.accent{border-top:2px solid var(--ac);}
.hk-val{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#111;line-height:1;margin-bottom:2px;}
.hk-lbl{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:2px;color:#bbb;text-transform:uppercase;}
.hk-unit{font-family:'DM Mono',monospace;font-size:10px;color:#bbb;margin-left:2px;}
.hrv-badge{display:inline-flex;padding:5px 12px;border-radius:20px;font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px;}
.hrv-badge.max{background:#dcfce7;color:#16a34a;}
.hrv-badge.normal{background:#fef9c3;color:#a16207;}
.hrv-badge.low{background:#fee2e2;color:#dc2626;}
.hk-hist-card{background:#fff;border:1px solid #e0e0d8;border-radius:10px;overflow:hidden;margin-bottom:20px;}
.hk-hist-row{display:grid;grid-template-columns:72px repeat(3,1fr);gap:4px;padding:8px 12px;border-bottom:1px solid #f0f0e8;align-items:center;}
.hk-hist-row:last-child{border-bottom:none;}
.hk-hist-hdr{background:#f8f8f4;}
.hk-h-d{font-family:'DM Mono',monospace;font-size:9px;color:#888;}
.hk-h-v{font-family:'DM Mono',monospace;font-size:10px;color:#333;font-weight:500;text-align:center;}
.hk-hist-hdr .hk-h-v,.hk-hist-hdr .hk-h-d{color:#bbb;font-size:8px;text-transform:uppercase;font-weight:400;}

/* ── WORKOUT EVOLUTION ── */
.evo-block{background:#fff;border:1px solid #e0e0d8;border-left:3px solid var(--ac);border-radius:0 10px 10px 0;padding:11px 13px;margin-bottom:8px;}
.evo-title{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:2px;margin-bottom:8px;display:flex;align-items:center;gap:7px;color:var(--ac);}
.evo-zone{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:1px;color:#bbb;font-weight:400;}
.evo-row{display:flex;flex-direction:column;padding:5px 0;border-bottom:1px solid #f0f0e8;}
.evo-row:last-child{border-bottom:none;}
.evo-ex{font-size:10px;font-weight:600;color:#333;margin-bottom:3px;}
.evo-pts{display:flex;align-items:center;gap:3px;flex-wrap:wrap;}
.evo-pt{display:flex;flex-direction:column;align-items:center;}
.evo-pt-last .evo-kg{font-weight:700;}
.evo-date{font-family:'DM Mono',monospace;font-size:7px;color:#bbb;}
.evo-kg{font-family:'DM Mono',monospace;font-size:10px;color:#555;}
.evo-sep{font-size:9px;color:#ccc;margin:0 1px;}

/* ── BIO PAGE ── */
.meta-card{background:#fff;border:1px solid #e0e0d8;border-radius:0 12px 12px 0;border-left:3px solid var(--ac);padding:14px 16px;margin-bottom:16px;}
.meta-lbl{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:3px;color:var(--ac);text-transform:uppercase;margin-bottom:12px;}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.meta-item{background:#f8f8f4;border-radius:8px;padding:10px 11px;}
.meta-metric-lbl{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:2px;color:#bbb;text-transform:uppercase;margin-bottom:5px;}
.meta-current{font-size:22px;font-weight:500;color:#111;line-height:1;margin-bottom:2px;}
.meta-unit{font-family:'DM Mono',monospace;font-size:9px;color:#bbb;margin-left:1px;}
.meta-target-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.meta-target-lbl{font-family:'DM Mono',monospace;font-size:8px;color:#bbb;}
.meta-target-val{font-family:'DM Mono',monospace;font-size:9px;color:var(--ac);font-weight:500;}
.meta-delta{font-family:'DM Mono',monospace;font-size:8px;margin-top:4px;}
.bar-bg{height:3px;background:#e8e8e4;border-radius:2px;overflow:hidden;}
.bar-fill{height:100%;border-radius:2px;transition:width .6s ease;background:var(--ac);}
.bar-fill.ok{background:#10b981;}

.peso-card{background:#fff;border:1px solid #e0e0d8;border-radius:12px;padding:14px 16px;margin-bottom:16px;}
.peso-lbl{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:3px;color:#aaa;text-transform:uppercase;margin-bottom:12px;}
.peso-input-row{display:flex;gap:8px;align-items:stretch;}
.peso-inp{background:#f8f8f4;border:1.5px solid #e0e0d8;border-radius:8px;padding:11px 14px;font-family:'DM Mono',monospace;font-size:18px;color:#111;outline:none;-webkit-appearance:none;width:100%;font-weight:500;transition:border-color .2s;text-align:center;}
.peso-inp:focus{border-color:var(--ac);background:#fff;}
.peso-inp::placeholder{color:#ccc;font-size:13px;font-weight:400;}
.peso-save{padding:11px 18px;border:none;border-radius:8px;background:var(--ac);color:#fff;font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:1px;cursor:pointer;-webkit-appearance:none;touch-action:manipulation;flex-shrink:0;}
.peso-note{font-size:10px;color:#aaa;margin-top:6px;}

.bio-cards-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none;}
.bio-cards-row::-webkit-scrollbar{display:none;}
.bio-card{background:#fff;border:1px solid #e0e0d8;border-radius:10px;padding:10px 12px;min-width:140px;flex-shrink:0;}
.bio-card.latest{border-width:1.5px;border-color:var(--ac);}
.bio-card-date{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:1px;color:#aaa;margin-bottom:7px;text-transform:uppercase;}
.bio-card-date.c{color:var(--ac);}
.bio-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:0.5px solid #f4f4f0;}
.bio-row:last-child{border-bottom:none;}
.bio-rlbl{font-family:'DM Mono',monospace;font-size:8px;color:#bbb;text-transform:uppercase;letter-spacing:1px;}
.bio-rval{font-family:'DM Mono',monospace;font-size:11px;color:#333;font-weight:500;text-align:right;display:flex;align-items:center;gap:3px;}
.bio-tag{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:1px;color:var(--ac);background:rgba(245,147,0,0.08);padding:2px 5px;border-radius:8px;display:inline-block;margin-bottom:5px;}
.bio-tag.jrv{background:rgba(0,200,255,0.08);color:#00C8FF;}

.bio-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:20px;}
.bio-kpi{background:#fff;border:1px solid #e0e0d8;border-radius:8px;padding:9px;text-align:center;}
.bio-kpi-lbl{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:2px;color:#bbb;text-transform:uppercase;margin-bottom:3px;}
.bio-kpi-val{font-family:'Bebas Neue',sans-serif;font-size:18px;line-height:1;}

.chart-card{background:#fff;border:1px solid #e0e0d8;border-radius:10px;padding:14px;margin-bottom:14px;}
.chart-lbl{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:3px;color:#bbb;text-transform:uppercase;margin-bottom:12px;}
.chart-wrap{position:relative;height:160px;}

/* ── EDIT METAS ── */
.metas-form{background:#fff;border:1px solid #e0e0d8;border-radius:12px;padding:14px 16px;margin-bottom:14px;}
.metas-form-lbl{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:3px;color:#aaa;text-transform:uppercase;margin-bottom:12px;}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.fg{display:flex;flex-direction:column;gap:4px;}
.fl{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:2px;color:#aaa;text-transform:uppercase;}
.fi{background:#f8f8f4;border:1.5px solid #e0e0d8;border-radius:7px;padding:9px 10px;font-family:'DM Mono',monospace;font-size:14px;color:#111;outline:none;-webkit-appearance:none;width:100%;font-weight:500;transition:border-color .2s;}
.fi:focus{border-color:var(--ac);background:#fff;}
.fi::placeholder{color:#ccc;font-size:11px;}
.fi-save{width:100%;margin-top:4px;padding:12px;border:none;border-radius:8px;background:var(--ac);color:#fff;font-family:'DM Mono',monospace;font-size:10px;font-weight:500;letter-spacing:2px;cursor:pointer;-webkit-appearance:none;touch-action:manipulation;}

// ── DRAFT ────────────────────────────────────────────────────────────────────
function getDraftKey(p, i) { return `dup_draft_${p}_${i}`; }
function saveDraft(p, i) {
  const pg = document.getElementById(`page-${p}-${i}`); if (!pg) return;
  const draft = [];
  pg.querySelectorAll('.ex-card').forEach(card => {
    const sets = [];
    card.querySelectorAll('.set-row').forEach(row => {
      const inp = row.querySelectorAll('.inp');
      sets.push({ kg: inp[0]?.value||'', reps: inp[1]?.value||'', done: row.querySelector('.ok-btn')?.classList.contains('done')||false });
    });
    draft.push({ sets, obs: card.querySelector('.obs')?.value||'' });
  });
  try { localStorage.setItem(getDraftKey(p,i), JSON.stringify(draft)); } catch(e) {}
}
function loadDraft(p, i) {
  try {
    const raw = localStorage.getItem(getDraftKey(p,i)); if (!raw) return;
    const draft = JSON.parse(raw);
    const pg = document.getElementById(`page-${p}-${i}`); if (!pg) return;
    pg.querySelectorAll('.ex-card').forEach((card,ci) => {
      const exD = draft[ci]; if (!exD) return;
      card.querySelectorAll('.set-row').forEach((row,si) => {
        const sD = exD.sets?.[si]; if (!sD) return;
        const inp = row.querySelectorAll('.inp');
        if (inp[0]) inp[0].value = sD.kg||'';
        if (inp[1]) inp[1].value = sD.reps||'';
        if (sD.done) {
          const ok = row.querySelector('.ok-btn');
          if (ok) { ok.classList.add('done'); ok.textContent='✓'; inp.forEach(i=>i.classList.add('faded')); }
        }
      });
      const obs = card.querySelector('.obs');
      if (obs && exD.obs) obs.value = exD.obs;
      const total = card.querySelectorAll('.ok-btn').length;
      const done  = card.querySelectorAll('.ok-btn.done').length;
      const el = card.querySelector('.ex-num');
      if (el) el.textContent = done===0 ? el.dataset.base : done===total ? el.dataset.base+' ✓' : el.dataset.base+` · ${done}/${total}`;
    });
  } catch(e) {}
}
function clearDraft(p, i) { try { localStorage.removeItem(getDraftKey(p,i)); } catch(e) {} }

// ── API ───────────────────────────────────────────────────────────────────────
function setSyncStatus(s,t){
  const dot=document.getElementById('sync-dot'),txt=document.getElementById('sync-text');
  dot.className='sync-dot'+(s==='syncing'?' syncing':s==='error'?' error':'');
  txt.textContent=t||'NUVEM';
}
async function apiGet(action,profile){
  setSyncStatus('syncing','SINC...');
  try{
    const r=await fetch(`${API_URL}?action=${action}&profile=${profile}`,{method:'GET'});
    const d=await r.json();
    setSyncStatus('ok','NUVEM ✓');
    return d;
  }catch(e){ setSyncStatus('error','OFFLINE'); return {ok:false}; }
}
async function apiPost(body){
  setSyncStatus('syncing','SALVANDO...');
  try{
    await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
    setSyncStatus('ok','SALVO ✓');
    return {ok:true};
  }catch(e){ setSyncStatus('error','ERRO'); return {ok:false}; }
}

async function syncDown(p){
  const [wR,bR,hR,bioR,hkR,mR,pR]=await Promise.all([
    apiGet('list',p), apiGet('listBio',p), apiGet('listHRV',p),
    apiGet('getBioHistory',p), apiGet('listHealthKit',p),
    apiGet('getMetas',p), apiGet('listPeso',p)
  ]);
  if(wR.ok)  STATE[p].hist       = (wR.data||[]).sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(bR.ok)  STATE[p].bio        = bR.data||[];
  if(hR.ok)  STATE[p].hrv        = hR.data||{};
  if(bioR&&bioR.ok) STATE[p].bioHistory = bioR.data||[];
  if(hkR.ok) STATE[p].healthkit  = hkR.data||[];
  if(mR.ok)  STATE[p].metas      = mR.data||null;
  if(pR.ok)  STATE[p].peso       = pR.data||[];
}
async function syncAll(){
  showLoading('Carregando dados...');
  await Promise.all([syncDown('fk'),syncDown('jrv')]);
  hideLoading();
}
function showLoading(t){document.getElementById('loading-text').textContent=t||'SINCRONIZANDO...';document.getElementById('loading').classList.add('show');}
function hideLoading(){document.getElementById('loading').classList.remove('show');}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function ac(p){ return PROFILE_COLORS[p]||'#888'; }
function setAC(p){ document.documentElement.style.setProperty('--ac', ac(p)); }

function getLastWorkout(p,wkId){ return STATE[p].hist.find(h=>h.wkId===wkId); }
function fmtDate(iso){
  const d=new Date(iso),today=new Date();
  const diff=Math.floor((today-d)/(1000*60*60*24));
  if(diff===0)return 'hoje';if(diff===1)return 'ontem';
  if(diff<7)return `há ${diff} dias`;if(diff<14)return `há 1 semana`;
  if(diff<30)return `há ${Math.floor(diff/7)} semanas`;
  return d.toLocaleDateString('pt-BR');
}
function fmtD(d){
  if(!d)return '—';const s=String(d);
  if(s.includes('T')||s.includes('-')){const dt=new Date(s);return isNaN(dt)?s:dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'});}
  return s;
}
function fmtN(v,dec=0){
  const n=parseFloat(String(v).replace(',','.'));
  if(!n||n<=0)return '—';
  return dec>0?n.toFixed(dec):Math.round(n).toLocaleString('pt-BR');
}
function bioArrow(val,prev,goodDown){
  if(val==null||prev==null)return '';
  const diff=parseFloat(val)-parseFloat(prev);
  if(Math.abs(diff)<0.05)return `<span style="color:#aaa;font-size:9px">—</span>`;
  const up=diff>0,good=goodDown?!up:up,color=good?'#10b981':'#ef4444',arrow=up?'▲':'▼',sign=up?'+':'';
  return `<span style="color:${color};font-size:9px">${arrow}${sign}${Math.abs(diff).toFixed(1)}</span>`;
}

let CHARTS={};
function mkChart(id,labels,datasets){
  if(CHARTS[id]){CHARTS[id].destroy();delete CHARTS[id];}
  const ctx=document.getElementById(id);if(!ctx)return;
  CHARTS[id]=new Chart(ctx,{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:datasets.length>1,labels:{font:{family:'DM Sans',size:10},color:'#888',boxWidth:10,padding:10}}},
    scales:{x:{grid:{color:'#f0f0e8'},ticks:{font:{family:'DM Mono',size:9},color:'#bbb'}},y:{grid:{color:'#f0f0e8'},ticks:{font:{family:'DM Mono',size:9},color:'#bbb'}}},
    elements:{point:{radius:4,hoverRadius:6},line:{tension:0.3}}}});
}

// ── SAVE WORKOUT ──────────────────────────────────────────────────────────────
async function saveAndSend(p,wkIdx){
  const wks=p==='fk'?FK_WK:JRV_WK,w=wks[wkIdx];
  const pg=document.getElementById(`page-${p}-${wkIdx}`);
  let exData=[],hasData=false;
  pg.querySelectorAll('.ex-card').forEach((card,ci)=>{
    const ex=w.ex[ci];let sets=[];
    card.querySelectorAll('.set-row').forEach((row,si)=>{
      const kg=row.querySelectorAll('.inp')[0]?.value||'';
      const rp=row.querySelectorAll('.inp')[1]?.value||'';
      const ok=row.querySelector('.ok-btn')?.classList.contains('done');
      if(kg||rp){sets.push({s:si+1,kg,reps:rp,ok});hasData=true;}
    });
    const obs=card.querySelector('.obs')?.value||'';
    if(sets.length||obs)exData.push({n:ex.n,name:ex.name,sets,obs});
  });
  if(!hasData){alert('Registre pelo menos uma carga antes de salvar.');return;}
  const btn=pg.querySelector('.save-btn');
  btn.classList.add('saving');btn.innerHTML='<span>⏳</span> SALVANDO...';
  const entry={id:Date.now(),wkId:w.id,title:w.title,zone:w.zoneLabel,zc:ac(p),date:new Date().toISOString(),exercises:exData};
  await apiPost({action:'saveWorkout',profile:p,workout:entry});
  STATE[p].hist.unshift(entry);
  btn.classList.remove('saving');btn.classList.add('saved');btn.innerHTML='<span>✓</span> SALVO NA NUVEM';
  clearDraft(p,wkIdx);
  setTimeout(()=>{
    pg.querySelectorAll('.inp').forEach(i=>{i.value='';i.classList.remove('faded');});
    pg.querySelectorAll('.ok-btn').forEach(b=>{b.classList.remove('done');b.textContent='○';});
    pg.querySelectorAll('.obs').forEach(o=>o.value='');
    pg.querySelectorAll('.ex-num').forEach(el=>el.textContent=el.dataset.base);
    btn.classList.remove('saved');btn.innerHTML='<span>📤</span> Salvar Treino na Nuvem';
    renderWorkoutPage(p,wkIdx);
  },2500);
}

        <div class="hist-ex">
          <div class="hist-ex-name">${ex.n}. ${ex.name}</div>
          ${(ex.sets||[]).map(s=>`<div class="hist-set">S${s.s}: ${s.kg||'?'}kg × ${s.reps||'?'} reps ${s.ok?'✓':'·'}</div>`).join('')}
          ${ex.obs?`<div class="hist-obs">"${ex.obs}"</div>`:''}
        </div>`).join('');
      return `<div class="hist-item" style="--ac:${h.zc||ac(p)}">
        <button class="hist-head" onclick="this.nextElementSibling.classList.toggle('open')">
          <div class="hist-top">
            <div><div class="hist-wk">${h.title}</div><div class="hist-meta"><span class="hist-chip z">${h.zone}</span><span class="hist-chip">${(h.exercises||[]).length} exerc.</span></div></div>
            <div class="hist-dt">${fmtDate(h.date)}<br>${new Date(h.date).toLocaleDateString('pt-BR')}</div>
          </div>
        </button>
        <div class="hist-body">${exHtml}
          <button class="hist-del" onclick="delHist('${p}',${h.id})">🗑 REMOVER</button>
        </div>
      </div>`;
    }).join('');
  div.innerHTML=`<div class="profile-badge badge-${isJ?'jrv':'fk'}">${isJ?'· J.R.V.':'· F.K.'}</div>
    <div class="page-title">HISTÓRICO</div>
    <div class="page-sub">${hist.length} treinos registrados</div>${html}`;
}
async function delHist(p,id){
  if(!confirm('Remover este registro?'))return;
  STATE[p].hist=STATE[p].hist.filter(h=>h.id!==id);
  renderHist(p);
  await apiPost({action:'delWorkout',profile:p,id});
}

function buildWorkoutEvolution(p){
  const hist=STATE[p].hist||[];
  const wks=p==='fk'?FK_WK:JRV_WK;
  if(!hist.length)return `<div class="empty" style="padding:20px">📈<br><br>Evolução aparecerá aqui após os primeiros treinos.</div>`;
  const byWk={};
  hist.forEach(h=>{if(!byWk[h.wkId])byWk[h.wkId]=[];byWk[h.wkId].push(h);});
  let html='';
  wks.forEach(wk=>{
    const sessions=(byWk[wk.id]||[]).slice(0,3);if(!sessions.length)return;
    const exMap={};
    sessions.forEach(sess=>{
      const dateStr=new Date(sess.date).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
      (sess.exercises||[]).forEach(ex=>{
        if(!exMap[ex.n])exMap[ex.n]={name:ex.name,sessions:[]};
        const maxKg=Math.max(...(ex.sets||[]).map(s=>parseFloat(s.kg)||0).filter(v=>v>0));
        exMap[ex.n].sessions.push({date:dateStr,kg:maxKg>0?maxKg:null});
      });
    });
    const exRows=Object.values(exMap).map(ex=>{
      const pts=ex.sessions.map((s,i)=>{
        const isLast=i===0;
        return `<span class="evo-pt${isLast?' evo-pt-last':''}" style="${isLast?`color:var(--ac)`:''}"><span class="evo-date">${s.date}</span><span class="evo-kg">${s.kg!=null?s.kg+'kg':'—'}</span></span>`;
      }).join('<span class="evo-sep">→</span>');
      return `<div class="evo-row"><span class="evo-ex">${ex.name}</span><div class="evo-pts">${pts}</div></div>`;
    }).join('');
    html+=`<div class="evo-block" style="--ac:${wk.zc||ac(p)}"><div class="evo-title">${wk.title} <span class="evo-zone">${wk.zoneLabel}</span></div>${exRows}</div>`;
  });
  return html||`<div class="empty" style="padding:20px">📈<br><br>Nenhum treino ainda.</div>`;
}

// ── BIO PAGE ──────────────────────────────────────────────────────────────────
function renderBio(p){
  const div=document.getElementById(`page-${p}-bio`);if(!div)return;
  const isJ=p==='jrv';
  const bh=STATE[p].bioHistory||[];
  const metas=STATE[p].metas;
  const pesoData=STATE[p].peso||[];
  const latest=bh[0]||null;

  let html=`<div class="profile-badge badge-${isJ?'jrv':'fk'}">${isJ?'· J.R.V.':'· F.K.'}</div>
    <div class="page-title">BIOIMPEDÂNCIA</div>
    <div class="page-sub">Metas · Peso diário · Histórico</div>`;

  // ── METAS ──
  html+=`<div class="sec-lbl">Próxima meta</div>`;
  if(metas && latest){
    const pCurrent=parseFloat(latest.peso)||0;
    const gCurrent=parseFloat(latest.gordura)||0;
    const mCurrent=parseFloat(latest.muscEsq)||0;
    const vCurrent=parseFloat(latest.visceral)||0;
    const pMeta=parseFloat(metas.peso)||0;
    const gMeta=parseFloat(metas.gordura)||0;
    const mMeta=parseFloat(metas.massaMagra)||0;
    const vMeta=parseFloat(metas.visceral)||0;
    function barPct(cur,meta,goodDown){
      if(!meta||!cur)return 50;
      const start=goodDown?meta*1.12:meta*0.88;
      const range=Math.abs(start-meta);
      const progress=goodDown?(start-cur)/range:(cur-start)/range;
      return Math.max(5,Math.min(98,progress*100));
    }
    function deltaLabel(cur,meta,unit,goodDown){
      const d=(cur-meta);const abs=Math.abs(d).toFixed(1);
      const arrived=Math.abs(d)<0.15;
      if(arrived)return `<span style="color:#10b981">✓ meta atingida</span>`;
      const needDown=goodDown&&d>0||!goodDown&&d<0;
      return `<span style="color:${needDown?'#ef4444':'#10b981'}">${needDown?'▼':'▲'} ${abs} ${unit} para a meta</span>`;
    }
    html+=`<div class="meta-card">
      <div class="meta-lbl">Ciclo atual · metas</div>
      <div class="meta-grid">
        <div class="meta-item">
          <div class="meta-metric-lbl">Peso</div>
          <div class="meta-current">${pCurrent.toFixed(1)}<span class="meta-unit">kg</span></div>
          <div class="meta-target-row"><span class="meta-target-lbl">meta</span><span class="meta-target-val">${pMeta} kg</span></div>
          <div class="bar-bg"><div class="bar-fill" style="width:${barPct(pCurrent,pMeta,true)}%"></div></div>
          <div class="meta-delta">${deltaLabel(pCurrent,pMeta,'kg',true)}</div>
        </div>
        <div class="meta-item">
          <div class="meta-metric-lbl">Gordura</div>
          <div class="meta-current">${gCurrent.toFixed(1)}<span class="meta-unit">%</span></div>
          <div class="meta-target-row"><span class="meta-target-lbl">meta</span><span class="meta-target-val">${gMeta} %</span></div>
          <div class="bar-bg"><div class="bar-fill" style="width:${barPct(gCurrent,gMeta,true)}%"></div></div>
          <div class="meta-delta">${deltaLabel(gCurrent,gMeta,'pp',true)}</div>
        </div>
        <div class="meta-item">
          <div class="meta-metric-lbl">Massa Magra</div>
          <div class="meta-current">${mCurrent.toFixed(1)}<span class="meta-unit">kg</span></div>
          <div class="meta-target-row"><span class="meta-target-lbl">meta</span><span class="meta-target-val">${mMeta} kg</span></div>
          <div class="bar-bg"><div class="bar-fill ok" style="width:${barPct(mCurrent,mMeta,false)}%"></div></div>
          <div class="meta-delta">${deltaLabel(mCurrent,mMeta,'kg',false)}</div>
        </div>
        <div class="meta-item">
          <div class="meta-metric-lbl">Visceral</div>
          <div class="meta-current">${vCurrent}<span class="meta-unit"> nív</span></div>
          <div class="meta-target-row"><span class="meta-target-lbl">meta</span><span class="meta-target-val">nív ${vMeta}</span></div>
          <div class="bar-bg"><div class="bar-fill" style="width:${barPct(vCurrent,vMeta,true)}%"></div></div>
          <div class="meta-delta">${deltaLabel(vCurrent,vMeta,'níveis',true)}</div>
        </div>
      </div>
    </div>`;
  } else if(!metas){
    html+=`<div class="empty" style="margin-bottom:14px">🎯<br><br>Defina as metas abaixo para ver o progresso aqui.</div>`;
  } else {
    html+=`<div class="empty" style="margin-bottom:14px">📊<br><br>Aguardando dados da bioimpedância para calcular o progresso.</div>`;
  }

  // ── PESO DIÁRIO ──
  html+=`<div class="sec-lbl">Peso do dia</div>
    <div class="peso-card">
      <div class="peso-lbl">Registro rápido</div>
      <div class="peso-input-row">
        <input class="peso-inp" id="${p}-peso-inp" type="number" inputmode="decimal" step="0.1" placeholder="83.4 kg">
        <button class="peso-save" onclick="savePeso('${p}')">SALVAR</button>
      </div>
      <div class="peso-note" id="${p}-peso-note">${pesoData.length>0?`Último: ${pesoData[0].peso} kg · ${fmtD(pesoData[0].date)}`:'Nenhum registro ainda.'}</div>
    </div>`;

  // ── BIOIMPEDÂNCIA HISTÓRICO ──
  html+=`<div class="sec-lbl">Últimas 3 aferições</div>`;
  if(bh.length){
    const cards=bh.map((m,i)=>{
      const prev=bh[i+1];
      const dP=prev?bioArrow(m.peso,prev.peso,false):'';
      const dG=prev?bioArrow(m.gordura,prev.gordura,true):'';
      const dM=prev?bioArrow(m.muscEsq,prev.muscEsq,false):'';
      const dV=prev?bioArrow(m.visceral,prev.visceral,true):'';
      const isLatest=i===0;
      return `<div class="bio-card${isLatest?' latest':''}">
        ${isLatest?`<div class="bio-tag${isJ?' jrv':''}">atual</div>`:'<div style="height:20px"></div>'}
        <div class="bio-card-date${isLatest?' c':''}">${m.date}</div>
        <div class="bio-row"><span class="bio-rlbl">Peso</span><span class="bio-rval">${m.peso}kg ${dP}</span></div>
        <div class="bio-row"><span class="bio-rlbl">Gordura</span><span class="bio-rval">${m.gordura}% ${dG}</span></div>
        <div class="bio-row"><span class="bio-rlbl">M.Magra</span><span class="bio-rval">${m.muscEsq}kg ${dM}</span></div>
        <div class="bio-row"><span class="bio-rlbl">Visceral</span><span class="bio-rval">${m.visceral} ${dV}</span></div>
      </div>`;
    }).join('');
    const first=bh[bh.length-1],last2=bh[0];
    const dPeso=(parseFloat(last2.peso)-parseFloat(first.peso)).toFixed(1);
    const dGord=(parseFloat(last2.gordura)-parseFloat(first.gordura)).toFixed(1);
    const dMusc=(parseFloat(last2.muscEsq)-parseFloat(first.muscEsq)).toFixed(1);
    const fmt2=(v,goodDown)=>{const n=parseFloat(v),good=goodDown?n<=0:n>=0;return `<span style="color:${good?'#10b981':'#ef4444'};font-weight:500">${n>0?'+':''}${v}</span>`;};
    html+=`<div class="bio-cards-row">${cards}</div>
      <div class="bio-summary">
        <div class="bio-kpi"><div class="bio-kpi-lbl">Peso</div><div class="bio-kpi-val">${fmt2(dPeso,false)}</div></div>
        <div class="bio-kpi"><div class="bio-kpi-lbl">Gordura</div><div class="bio-kpi-val">${fmt2(dGord,true)}</div></div>
        <div class="bio-kpi"><div class="bio-kpi-lbl">M.Magra</div><div class="bio-kpi-val">${fmt2(dMusc,false)}</div></div>
      </div>`;
    if(bh.length>=2){
      const labels2=bh.slice().reverse().map(m=>m.date);
      html+=`<div class="chart-card"><div class="chart-lbl">Peso (kg)</div><div class="chart-wrap"><canvas id="${p}-ch-peso"></canvas></div></div>
        <div class="chart-card"><div class="chart-lbl">Composição corporal</div><div class="chart-wrap"><canvas id="${p}-ch-comp"></canvas></div></div>`;
      setTimeout(()=>{
        const pColor=ac(p);
        mkChart(`${p}-ch-peso`,labels2,[{label:'Peso',data:bh.slice().reverse().map(m=>parseFloat(m.peso)),borderColor:pColor,backgroundColor:pColor+'20',fill:true,borderWidth:2}]);
        mkChart(`${p}-ch-comp`,labels2,[
          {label:'Gordura %',data:bh.slice().reverse().map(m=>parseFloat(m.gordura)),borderColor:'#f59e0b',fill:false,borderWidth:2},
          {label:'M.Magra kg',data:bh.slice().reverse().map(m=>parseFloat(m.muscEsq)),borderColor:'#10b981',fill:false,borderWidth:2}
        ]);
      },80);
    }
  } else {
    html+=`<div class="empty">📊<br><br>Dados de bioimpedância aparecerão aqui após a sincronização.</div>`;
  }

  if(pesoData.length>=3){
    const pesoLabels=pesoData.slice(0,30).reverse().map(d=>fmtD(d.date));
    const pesoVals=pesoData.slice(0,30).reverse().map(d=>parseFloat(d.peso));
    html+=`<div class="sec-lbl" style="margin-top:6px">Peso diário · últimos 30 dias</div>
      <div class="chart-card"><div class="chart-lbl">Tendência de peso</div><div class="chart-wrap"><canvas id="${p}-ch-peso-daily"></canvas></div></div>`;
    setTimeout(()=>{
      mkChart(`${p}-ch-peso-daily`,pesoLabels,[{label:'Peso kg',data:pesoVals,borderColor:ac(p),backgroundColor:ac(p)+'15',fill:true,borderWidth:2,pointRadius:3}]);
    },100);
  }

  // ── EDITAR METAS ──
  html+=`<div class="sec-lbl" style="margin-top:6px">Definir metas</div>
    <div class="metas-form">
      <div class="metas-form-lbl">Editar metas do ciclo</div>
      <div class="form-row-2">
        <div class="fg"><label class="fl">Peso meta (kg)</label><input class="fi" id="${p}-m-peso" type="number" step="0.1" placeholder="${metas?metas.peso:'80.0'}"></div>
        <div class="fg"><label class="fl">Gordura meta (%)</label><input class="fi" id="${p}-m-gord" type="number" step="0.1" placeholder="${metas?metas.gordura:'15.0'}"></div>
      </div>
      <div class="form-row-2">
        <div class="fg"><label class="fl">Massa magra (kg)</label><input class="fi" id="${p}-m-musc" type="number" step="0.1" placeholder="${metas?metas.massaMagra:'66.0'}"></div>
        <div class="fg"><label class="fl">Visceral (nível)</label><input class="fi" id="${p}-m-visc" type="number" step="1" placeholder="${metas?metas.visceral:'6'}"></div>
      </div>
      <button class="fi-save" onclick="saveMetas('${p}')">SALVAR METAS</button>
      <div class="save-msg" id="${p}-metas-msg">✓ METAS SALVAS</div>
    </div>`;

  div.innerHTML=html;
}

async function savePeso(p){
  const inp=document.getElementById(`${p}-peso-inp`);
  const val=parseFloat(inp.value);
  if(!val||val<20||val>300){alert('Informe um peso válido (ex: 83.4)');return;}
  await apiPost({action:'savePeso',profile:p,peso:val});
  STATE[p].peso.unshift({date:new Date().toISOString().split('T')[0],peso:val,obs:''});
  inp.value='';
  document.getElementById(`${p}-peso-note`).textContent=`Último: ${val} kg · hoje`;
}

async function saveMetas(p){
  const peso=document.getElementById(`${p}-m-peso`).value;
  const gord=document.getElementById(`${p}-m-gord`).value;
  const musc=document.getElementById(`${p}-m-musc`).value;
  const visc=document.getElementById(`${p}-m-visc`).value;
  if(!peso||!gord||!musc||!visc){alert('Preencha todos os campos.');return;}
  const metas={peso:parseFloat(peso),gordura:parseFloat(gord),massaMagra:parseFloat(musc),visceral:parseFloat(visc)};
  STATE[p].metas=metas;
  await apiPost({action:'saveMetas',profile:p,metas});
  const msg=document.getElementById(`${p}-metas-msg`);
  msg.style.display='block';
  setTimeout(()=>{msg.style.display='none';renderBio(p);},1200);
}

function buildProfile(p, workouts){
  const tabsEl=document.getElementById('tabs');
  const pagesEl=document.getElementById('pages');

  function addTab(key, label){
    const tb=document.createElement('button');
    tb.className=`tab tab-${p}-${key}`;
    tb.textContent=label;
    tb.setAttribute('data-profile',p);
    tb.style.display=p==='fk'?'':'none';
    tb.onclick=()=>switchTab(p,key);
    tabsEl.appendChild(tb);
    const pg=document.createElement('div');
    pg.className='page';pg.id=`page-${p}-${key}`;
    pagesEl.appendChild(pg);
  }

  addTab('prog','📊 PROG');
  workouts.forEach((_,wi)=>addTab(wi, workouts[wi].label));
  addTab('hist','📋 HIST');
  addTab('bio','⚖️ BIO');
}

    </div>`:'';

  pg.innerHTML=`
    <div class="profile-badge badge-${isJ?'jrv':'fk'}" style="--ac:${color}">${isJ?'· J.R.V.':'· F.K.'}</div>
    <div class="wk-title" style="--ac:${color}">${w.title}</div>
    <div class="wk-sub">${w.sub}</div>
    <div class="zone-badge" style="--ac:${color};background:${color}">${w.zoneLabel}</div>
    <div class="stats" style="--ac:${color}">
      <div class="stat"><span class="stat-val">${w.series}</span><div class="stat-lbl">Séries</div></div>
      <div class="stat"><span class="stat-val">${w.reps}</span><div class="stat-lbl">Reps</div></div>
      <div class="stat"><span class="stat-val">${w.rest}</span><div class="stat-lbl">Descanso</div></div>
    </div>
    ${lastRef}
    <div class="sec-lbl">Exercícios · toque para registrar</div>
    <div class="ex-list" style="--ac:${color}">${exHtml}</div>
    <div class="send-wrap">
      <button class="save-btn" type="button" onclick="saveAndSend('${p}',${wkIdx})" style="--ac:${color}"><span>📤</span> Salvar Treino na Nuvem</button>
      <div class="send-note">Sincroniza automaticamente com a Carlota</div>
    </div>
    <div class="sec-lbl">Embasamento Científico</div>
    <div class="sci-box"><div class="sci-lbl">📚 Referência</div><div class="sci-txt">${w.ref}</div></div>
    <div class="sec-lbl">Dica da Sessão</div>
    <div class="tip-box" style="--ac:${color}"><div class="tip-lbl">💡 Carlota DUP</div><div class="tip-txt">${w.tip}</div></div>`;

  pg.querySelectorAll('.ex-toggle').forEach(btn=>{
    btn.addEventListener('click',function(){
      const log=this.nextElementSibling,arr=this.querySelector('.arrow'),isOpen=log.classList.toggle('open');
      arr.textContent=isOpen?'▲':'▼';this.setAttribute('aria-expanded',isOpen);
    });
  });
  pg.querySelectorAll('.ok-btn').forEach(btn=>{
    btn.addEventListener('click',function(){
      this.classList.toggle('done');this.textContent=this.classList.contains('done')?'✓':'○';
      this.closest('.set-row').querySelectorAll('.inp').forEach(i=>i.classList.toggle('faded',this.classList.contains('done')));
      const card=this.closest('.ex-card'),total=card.querySelectorAll('.ok-btn').length,done=card.querySelectorAll('.ok-btn.done').length,el=card.querySelector('.ex-num');
      el.textContent=done===0?el.dataset.base:done===total?el.dataset.base+' ✓':el.dataset.base+` · ${done}/${total}`;
      saveDraft(p,wkIdx);
    });
  });
  pg.querySelectorAll('.clear-btn').forEach(btn=>{
    btn.addEventListener('click',function(){
      const card=this.closest('.ex-card');
      card.querySelectorAll('.inp').forEach(i=>{i.value='';i.classList.remove('faded');});
      card.querySelectorAll('.ok-btn').forEach(b=>{b.classList.remove('done');b.textContent='○';});
      card.querySelector('.obs').value='';
      const el=card.querySelector('.ex-num');el.textContent=el.dataset.base;
      saveDraft(p,wkIdx);
    });
  });
  pg.querySelectorAll('.inp,.obs').forEach(el=>{el.addEventListener('input',()=>saveDraft(p,wkIdx));});
  loadDraft(p,wkIdx);
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
const LAST_TAB={fk:'prog',jrv:'prog'};

function switchTab(p,idx){
  const wks=p==='fk'?FK_WK:JRV_WK;
  LAST_TAB[p]=idx;
  const activeClass=p==='fk'?'active-fk':'active-jrv';
  document.querySelectorAll(`.tab[data-profile="${p}"]`).forEach(t=>t.classList.remove('active-fk','active-jrv'));
  const activeTab=document.querySelector(`.tab-${p}-${idx}`);
  if(activeTab)activeTab.classList.add(activeClass);
  document.querySelectorAll('.page').forEach(pg=>pg.classList.remove('active'));
  const activePage=document.getElementById(`page-${p}-${idx}`);
  if(activePage)activePage.classList.add('active');
  setAC(p);
  if(idx==='hist') renderHist(p);
  else if(idx==='prog') renderProg(p);
  else if(idx==='bio') renderBio(p);
  else renderWorkoutPage(p,idx);
}

async function switchProfile(p){
  PROFILE=p;
  const isJ=p==='jrv';
  document.getElementById('btn-fk').className=`profile-btn${!isJ?' active-fk':''}`;
  document.getElementById('btn-jrv').className=`profile-btn${isJ?' active-jrv':''}`;
  document.getElementById('logo-ver').style.color=isJ?'#00C8FF':'#888';
  document.querySelectorAll('.tab').forEach(t=>{t.style.display=t.getAttribute('data-profile')===p?'':'none';});
  document.querySelectorAll('.page').forEach(pg=>pg.classList.remove('active'));
  setAC(p);
  await syncDown(p);
  switchTab(p,LAST_TAB[p]);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
(async function init(){
  buildProfile('fk',FK_WK);
  buildProfile('jrv',JRV_WK);
  await syncAll();
  setAC('fk');
  switchTab('fk','prog');
})();
</script>
