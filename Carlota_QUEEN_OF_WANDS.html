        padding:'10px 14px', borderBottom:`1px solid ${ac}18`,
        display:'flex', justifyContent:'space-between', alignItems:'center'
      }}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontFamily:T.mono,fontSize:8,letterSpacing:'2.5px',textTransform:'uppercase',color:ac}}>
            ⚡ {wkId}
          </span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontFamily:T.mono,fontSize:8,color:T.muted}}>{date}</span>
          <span style={{fontFamily:T.mono,fontSize:9,color:T.muted}}>{expanded ? '▲' : '▼'}</span>
        </div>
      </div>

      {/* Métricas resumo — sempre visíveis */}
      <div style={{padding:'10px 10px 8px',display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:5}}>
        {[
          {label:'Kcal',    val:metrics.calories, diff:comparisons.calories?.diff},
          {label:'FC méd',  val:metrics.avgHR,    diff:comparisons.avgHR?.diff},
          {label:'FC máx',  val:metrics.maxHR,    diff:null},
          {label:'Dur min', val:metrics.duration, diff:comparisons.duration?.diff},
          {label:'Vol kg',  val:volStr,            diff:comparisons.volume?.diff},
        ].map(({label,val,diff}) => (
          <div key={label} style={{
            background:T.surface, border:`1px solid ${T.border}`,
            borderRadius:8, padding:'7px 3px', textAlign:'center'
          }}>
            <div style={{fontFamily:T.mono,fontSize:11,fontWeight:700,color:ac,lineHeight:1.1}}>
              {val > 0 || typeof val === 'string' ? val : '—'}
              {diff ? <DiffBadge diff={diff}/> : null}
            </div>
            <div style={{fontFamily:T.mono,fontSize:6,letterSpacing:'1px',textTransform:'uppercase',color:T.muted,marginTop:2}}>
              {label}
            </div>
          </div>
        ))}
      </div>

      {/* Densidade — sempre visível */}
      {comparisons.density?.current > 0 && (
        <div style={{padding:'0 12px 8px',display:'flex',gap:8,alignItems:'center'}}>
          <div style={{fontFamily:T.mono,fontSize:7,color:T.muted,letterSpacing:'1px',textTransform:'uppercase'}}>Densidade</div>
          <div style={{fontFamily:T.mono,fontSize:10,color:ac}}>{comparisons.density.current} kg·rep/min</div>
          <DiffBadge diff={comparisons.density.diff}/>
        </div>
      )}

      {/* Mensagens — só aparecem expandido */}
      {expanded && messages && messages.length > 0 && (
        <div style={{borderTop:`1px solid ${ac}15`,padding:'10px 14px 12px'}}>
          {metrics.postHRV > 0 && (
            <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:8}}>
              <div style={{fontFamily:T.mono,fontSize:7,color:T.muted,letterSpacing:'1px',textTransform:'uppercase'}}>HRV pós</div>
              <div style={{fontFamily:T.mono,fontSize:10,color:ac}}>{metrics.postHRV} ms</div>
            </div>
          )}
          {messages.map((msg,i) => (
            <div key={i} style={{
              fontSize:11, color:T.subtle, lineHeight:1.7,
              paddingLeft:10, borderLeft:`2px solid ${ac}35`,
              marginBottom: i < messages.length-1 ? 8 : 0
            }}>
              {msg}
            </div>
          ))}
        </div>
      )}

      {/* Preview da primeira mensagem quando fechado */}
      {!expanded && messages && messages.length > 0 && (
        <div style={{padding:'0 14px 10px'}}>
          <div style={{
            fontSize:10, color:T.dim, lineHeight:1.5,
            overflow:'hidden', display:'-webkit-box',
            WebkitLineClamp:1, WebkitBoxOrient:'vertical'
          }}>
            {messages[0]}
          </div>
        </div>
      )}
    </div>
  );
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// INSIGHTS CAROUSEL — histórico dos últimos 6 treinos com dados do Watch
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function InsightsCarousel({ insights, ac }) {
  const [expandedIdx, setExpandedIdx] = useState(0); // primeiro expandido por default
  const [page, setPage]               = useState(0);

  if (!insights || insights.length === 0) return null;

  const total = insights.length;

  return (
    <div style={{marginBottom:24}}>
      {/* Título da seção */}
      <div style={{
        display:'flex', justifyContent:'space-between', alignItems:'center',
        marginBottom:10
      }}>
        <div style={{fontFamily:T.mono,fontSize:8,letterSpacing:'3px',textTransform:'uppercase',color:T.muted}}>
          ⚡ INSIGHTS RECENTES
        </div>
        <div style={{fontFamily:T.mono,fontSize:8,color:T.muted}}>
          {page+1} / {total}
        </div>
      </div>

      {/* Card atual */}
      <InsightCard
        insightData={insights[page]}
        expanded={expandedIdx === page}
        onToggle={() => setExpandedIdx(expandedIdx === page ? -1 : page)}
      />

      {/* Navegação por pontos */}
      {total > 1 && (
        <div style={{display:'flex',justifyContent:'center',gap:6,marginTop:10}}>
          {insights.map((_,i) => (
            <button
              key={i}
              onClick={() => { setPage(i); setExpandedIdx(i); }}
              style={{
                width: i===page ? 18 : 6,
                height:6, borderRadius:3, border:'none', cursor:'pointer',
                background: i===page ? ac : T.border,
                padding:0, transition:'all .2s'
              }}
            />
          ))}
        </div>
      )}

      {/* Setas de navegação */}
      {total > 1 && (
        <div style={{display:'flex',justifyContent:'space-between',marginTop:8}}>
          <button
            onClick={() => { const p = Math.max(0,page-1); setPage(p); setExpandedIdx(p); }}
            disabled={page===0}
            style={{
              fontFamily:T.mono,fontSize:9,letterSpacing:'1px',
              background:'transparent',border:'none',cursor:page===0?'default':'pointer',
              color:page===0 ? T.border : T.muted, padding:'4px 0'
            }}
          >← anterior</button>
          <button
            onClick={() => { const p = Math.min(total-1,page+1); setPage(p); setExpandedIdx(p); }}
            disabled={page===total-1}
            style={{
              fontFamily:T.mono,fontSize:9,letterSpacing:'1px',
              background:'transparent',border:'none',cursor:page===total-1?'default':'pointer',
              color:page===total-1 ? T.border : T.muted, padding:'4px 0'
            }}
          >próximo →</button>
        </div>
      )}
    </div>
  );
}

function TreinoPage({ profile, state, onSave, onSaveCustom, savingWk, activeWk, setActiveWk }) {
  const ac  = PROFILE_COLORS[profile];
  const wks = profile==='fk' ? FK_WK : JRV_WK;
  const isCustom = activeWk === CUSTOM_WK_IDX;

  // activeWk é controlado pelo App — mantém o mesmo card ao trocar de perfil
  const safeWk = isCustom ? CUSTOM_WK_IDX : Math.min(activeWk, wks.length - 1);
  const wk     = isCustom ? null : wks[safeWk];
  const last   = wk ? state.hist.find(h => h.wkId===wk.id) : null;
  const zc     = wk ? (ZONE_COLORS[wk.zone] || ac) : ac;
  const saveKey   = `${profile}-${safeWk}`;
  const isSaving  = savingWk === saveKey;

  // openExIdx vive aqui (acima dos ExCard) — sobrevive à troca de perfil
  const [openExIdx, setOpenExIdx] = useState(null);
  // Ao mudar de treino, fecha o card aberto
  useEffect(() => { setOpenExIdx(null); }, [safeWk]);

  return (
    <div className="pb-safe">
      {/* Workout tab strip */}
      <div className="no-scroll" style={{
        display:'flex', overflowX:'auto',
        borderBottom:`1px solid ${T.border}`, background:T.bg
      }}>
        {wks.map((w,i) => (
          <button key={w.id} onClick={() => setActiveWk(i)} style={{
            flexShrink:0, padding:'10px 12px',
            border:'none', cursor:'pointer', background:'transparent',
            fontFamily:T.mono, fontSize:9, letterSpacing:'1.5px', textTransform:'uppercase',
            transition:'all .15s',
            color: (!isCustom && safeWk===i) ? ac : T.muted,
            borderBottom: `2px solid ${(!isCustom && safeWk===i) ? ac : 'transparent'}`,
          }}>
            {w.label}
          </button>
        ))}
        {/* Tab CUSTOM */}
        <button onClick={() => setActiveWk(CUSTOM_WK_IDX)} style={{
          flexShrink:0, padding:'10px 12px',
          border:'none', cursor:'pointer', background:'transparent',
          fontFamily:T.mono, fontSize:9, letterSpacing:'1.5px', textTransform:'uppercase',
          transition:'all .15s',
          color: isCustom ? ac : T.muted,
          borderBottom: `2px solid ${isCustom ? ac : 'transparent'}`,
        }}>+ CUSTOM</button>
      </div>

      {/* Tela de montagem do treino personalizado */}
      {isCustom && (
        <CustomWorkoutBuilder
          key={profile}
          profile={profile}
          state={state}
          onSaveCustom={onSaveCustom}
          savingWk={savingWk}
          ac={ac}
        />
      )}
      {!isCustom && <div style={{padding:'16px 16px 0'}}>
        {/* Workout header — spacious for in-gym use */}
        <div style={{marginBottom:20}}>
          <div style={{fontFamily:T.mono, fontSize:38, fontWeight:900, letterSpacing:'4px', lineHeight:1, color:T.text, marginBottom:4}}>
            {wk.title}
          </div>
          <div style={{fontSize:12, color:T.dim, marginBottom:14}}>{wk.sub}</div>

          <div style={{
            display:'inline-flex', alignItems:'center', padding:'5px 12px',
            borderRadius:4, fontFamily:T.mono, fontSize:9, letterSpacing:'2px', textTransform:'uppercase',
            background:`${zc}18`, color:zc, border:`1px solid ${zc}30`, marginBottom:14
          }}>
            {wk.zone}
          </div>

          {/* Stats grid */}
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8, marginBottom:14}}>
            {[['Séries',wk.series],['Reps',wk.reps],['Descanso',wk.rest]].map(([lbl,val]) => (
              <div key={lbl} style={{
                background:T.surface, border:`1px solid ${T.border}`,
                borderRadius:10, padding:'10px 6px', textAlign:'center'
              }}>
                <div style={{fontFamily:T.mono, fontSize:13, fontWeight:700, color:ac, lineHeight:1.2}}>{val}</div>
                <div style={{fontFamily:T.mono, fontSize:8, letterSpacing:'2px', textTransform:'uppercase', color:T.muted, marginTop:3}}>{lbl}</div>
              </div>
            ))}
          </div>

          {/* Last session reference */}
          {last && (
            <div style={{
              padding:'10px 12px', borderRadius:'0 10px 10px 0', marginBottom:14,
              background:T.surface, borderLeft:`2px solid ${ac}`,
              border:`1px solid ${T.border}`, borderLeftWidth:2
            }}>
              <div style={{fontFamily:T.mono, fontSize:8, letterSpacing:'2px', textTransform:'uppercase', color:T.muted, marginBottom:3}}>
                🕐 Último {wk.title}
              </div>
              <div style={{fontFamily:T.mono, fontSize:10, color:ac}}>{fmtDate(last.date)}</div>
              <div style={{fontSize:10, color:T.dim, marginTop:2}}>{(last.exercises||[]).length} exercícios · Ver em HIST</div>
            </div>
          )}
        </div>

        {/* Exercise list */}
        <SLabel>Exercícios · toque para registrar</SLabel>
        {wk.ex.map((ex,i) => {
          // Busca em cascata — mais específico → menos específico:
          // 1º: mesmo exercício + mesmo treino (wkId)   → carga mais relevante
          // 2º: mesmo exercício + mesma zona (FORÇA etc) → mesma intensidade, treino diferente
          // 3º: sem referência                           → exercício nunca feito nessa intensidade
          const lastExRef = (() => {
            const hist = state.hist || [];
            const byName = (entry) => (entry.exercises||[]).find(e => e.name === ex.name);
            // Nível 1: mesmo wkId
            for (const wkEntry of hist) {
              if (wkEntry.wkId === wk.id) {
                const found = byName(wkEntry);
                if (found) return { date: wkEntry.date, sets: found.sets };
              }
            }
            // Nível 2: mesma zone
            for (const wkEntry of hist) {
              if (wkEntry.zone === wk.zone) {
                const found = byName(wkEntry);
                if (found) return { date: wkEntry.date, sets: found.sets };
              }
            }
            return null;
          })();
          return (
            <ExCard
              key={`${profile}-${safeWk}-${i}`}
              ex={ex} profile={profile} wkIdx={safeWk} exIdx={i} ac={ac}
              lastRef={lastExRef}
              isOpen={openExIdx === i}
              onToggle={() => setOpenExIdx(openExIdx === i ? null : i)}
            />
          );
        })}

        {/* Save button */}
        <div style={{marginBottom:24, marginTop:8}}>
          <button
            onClick={() => onSave(profile, safeWk)}
            disabled={isSaving}
            style={{
              width:'100%', padding:'16px',
              borderRadius:12, border:'none', cursor:'pointer',
              fontFamily:T.mono, fontSize:11, fontWeight:700,
              letterSpacing:'3px', textTransform:'uppercase',
              background: isSaving ? '#047857' : ac,
              color: '#FFFFFF',
              display:'flex', alignItems:'center', justifyContent:'center', gap:8,
              transition:'all .2s'
            }}
          >
            {isSaving ? '✓ TREINO SALVO' : '↑ SALVAR TREINO'}
          </button>
          <div style={{textAlign:'center', marginTop:8, fontFamily:T.mono, fontSize:9, color:T.muted}}>
            {isSaving ? 'Encerre o treino no Watch — insights chegam automaticamente' : 'Sincroniza automaticamente com a nuvem'}
          </div>
        </div>

        {/* Carrossel de insights — histórico dos últimos 6 treinos com dados do Watch */}
        {state.insights && state.insights.length > 0 && (
          <InsightsCarousel insights={state.insights} ac={ac} />
        )}

        {/* Scientific refs */}
        <div style={{padding:'12px 14px', borderRadius:10, marginBottom:10, background:T.surface, border:`1px solid ${T.border}`}}>
          <div style={{fontFamily:T.mono, fontSize:8, letterSpacing:'3px', textTransform:'uppercase', color:'#3b82f6', marginBottom:6}}>📚 REFERÊNCIA</div>
          <div style={{fontSize:11, color:'#4a72a8', lineHeight:1.7}}>{wk.ref}</div>
        </div>
        <div style={{padding:'12px 14px', borderRadius:'0 10px 10px 0', marginBottom:32, background:T.surface, border:`1px solid ${T.border}`, borderLeft:`2px solid ${ac}`}}>
          <div style={{fontFamily:T.mono, fontSize:8, letterSpacing:'3px', textTransform:'uppercase', color:ac, marginBottom:6}}>💡 DICA</div>
          <div style={{fontSize:11, color:T.subtle, lineHeight:1.7}}>{wk.tip}</div>
        </div>
      </div>}
    </div>
  );
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// PAGE: HIST
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function HistPage({ profile, state, onDelete }) {
  const ac = PROFILE_COLORS[profile];
  const hist = state.hist;
  const [openId, setOpenId] = useState(null);
  const [filterWk, setFilterWk] = useState('all');

  // Extrai labels únicos do histórico (mantém ordem de aparição)
  const wkOptions = React.useMemo(() => {
    const seen = new Set();
    const opts = [];
    hist.forEach(h => {
      const key = h.wkId || h.title;
      if (!seen.has(key)) {
        seen.add(key);
        opts.push({ id: key, label: h.title });
      }
    });
    return opts;
  }, [hist]);

  const filtered = filterWk === 'all' ? hist : hist.filter(h => (h.wkId || h.title) === filterWk);

  return (
    <div className="pb-safe" style={{padding:'16px 16px 0'}}>
      <div style={{fontFamily:T.mono, fontSize:34, fontWeight:900, letterSpacing:'4px', color:T.text, lineHeight:1, marginBottom:4}}>HISTÓRICO</div>
      <div style={{fontSize:12, color:T.dim, marginBottom:12}}>{hist.length} treinos registrados</div>

      {/* ── FILTRO POR TREINO ── */}
      {wkOptions.length > 1 && (
        <div className="no-scroll" style={{display:'flex', gap:6, overflowX:'auto', paddingBottom:4, marginBottom:16}}>
          <button
            onClick={() => setFilterWk('all')}
            style={{
              flexShrink:0, padding:'5px 14px', borderRadius:20, border:'none', cursor:'pointer',
              fontFamily:T.mono, fontSize:9, letterSpacing:'1.5px', textTransform:'uppercase',
              background: filterWk==='all' ? ac : T.surface,
              color: filterWk==='all' ? '#fff' : T.muted,
              border: filterWk==='all' ? `1px solid ${ac}` : `1px solid ${T.border}`,
              transition: 'all .15s'
            }}
          >TODOS</button>
          {wkOptions.map(opt => {
            const active = filterWk === opt.id;
            const wk = (profile==='fk'?FK_WK:JRV_WK).find(w => w.id === opt.id);
            const zc = wk ? (ZONE_COLORS[wk.zone] || ac) : ac;
            return (
              <button
                key={opt.id}
                onClick={() => setFilterWk(active ? 'all' : opt.id)}
                style={{
                  flexShrink:0, padding:'5px 14px', borderRadius:20, cursor:'pointer',
                  fontFamily:T.mono, fontSize:9, letterSpacing:'1.5px', textTransform:'uppercase',
                  background: active ? `${zc}18` : T.surface,
                  color: active ? zc : T.muted,
                  border: `1px solid ${active ? zc+'60' : T.border}`,
                  transition: 'all .15s'
                }}
              >
                {opt.label}
              </button>
            );
          })}
        </div>
      )}

      {filtered.length === 0 ? (
        <Card style={{textAlign:'center', padding:'48px 20px'}}>
          <div style={{fontSize:28, marginBottom:12}}>📋</div>
          <div style={{fontFamily:T.mono, fontSize:9, letterSpacing:'2px', textTransform:'uppercase', color:T.muted}}>
            {hist.length === 0 ? 'Nenhum treino registrado ainda' : 'Nenhum treino encontrado para este filtro'}
          </div>
        </Card>
      ) : filtered.map(h => {
        const zc = h.zc || ac;
        const isOpen = openId === h.id;
        return (
          <div key={h.id} style={{
            background:T.surface, border:`1px solid ${T.border}`,
            borderLeft:`2px solid ${zc}`, borderRadius:'0 12px 12px 0',
            marginBottom:8, overflow:'hidden'
          }}>
            <button onClick={() => setOpenId(isOpen ? null : h.id)} style={{
              width:'100%', textAlign:'left', background:'transparent',
              border:'none', cursor:'pointer', padding:'12px 14px'
            }}>
              <div style={{display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:10}}>
                <div>
                  <div style={{fontFamily:T.mono, fontSize:18, fontWeight:700, letterSpacing:'2px', color:T.text, lineHeight:1.2, marginBottom:6}}>
                    {h.title}
                  </div>
                  <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
                    <span style={{
                      fontFamily:T.mono, fontSize:8, padding:'3px 8px', borderRadius:4,
                      background:`${zc}18`, color:zc, border:`1px solid ${zc}30`
                    }}>{h.zone}</span>
                    <span style={{
                      fontFamily:T.mono, fontSize:8, padding:'3px 8px', borderRadius:4,
                      background:T.card, color:T.dim, border:`1px solid ${T.border}`
                    }}>{(h.exercises||[]).length} exerc.</span>
                  </div>
                </div>
                <div style={{textAlign:'right', flexShrink:0}}>
                  <div style={{fontFamily:T.mono, fontSize:9, color:T.dim}}>{fmtDate(h.date)}</div>
                  <div style={{fontFamily:T.mono, fontSize:9, color:T.muted, marginTop:2}}>
                    {new Date(h.date).toLocaleDateString('pt-BR')}
                  </div>
                </div>
              </div>
            </button>

            {isOpen && (
              <div className="anim-fadein" style={{borderTop:`1px solid ${T.border}`, padding:'12px 14px 14px'}}>
                {(h.exercises||[]).map((ex,i) => (
                  <div key={i} style={{marginBottom:12}}>
                    <div style={{fontSize:11, fontWeight:600, color:T.subtle, marginBottom:4}}>
                      {ex.n}. {ex.type==='biset' ? (ex.names||[]).join(' + ') : ex.name}
                      {ex.type==='biset' && <span style={{color:T.muted, fontWeight:400}}> · BI-SET</span>}
                    </div>
                    {ex.type==='biset' ? (
                      (ex.rounds||[]).map((r,j) => (
                        <div key={j} style={{fontFamily:T.mono, fontSize:10, color:T.muted, lineHeight:1.7}}>
                          R{r.round}: {(r.items||[]).map((it,k)=>`${(ex.names||[])[k]||`ex${k+1}`} ${it.kg||'?'}kg×${it.reps||'?'}`).join('  ·  ')}
                        </div>
                      ))
                    ) : (
                      (ex.sets||[]).map((s,j) => (
                        <React.Fragment key={j}>
                          <div style={{fontFamily:T.mono, fontSize:10, color:T.muted, lineHeight:1.7}}>
                            S{s.s}: {s.kg||'?'}kg × {s.reps||'?'} reps {s.ok?'✓':''}
                          </div>
                          {s.drops && s.drops.some(d=>d.kg||d.reps) && s.drops.map((d,k) => (
                            (d.kg || d.reps) && (
                              <div key={k} style={{fontFamily:T.mono, fontSize:9, color:'#f59e0b', lineHeight:1.6, marginLeft:10}}>
                                ↳ drop {k+1}: {d.kg||'?'}kg × {d.reps||'?'} reps
                              </div>
                            )
                          ))}
                        </React.Fragment>
                      ))
                    )}
                    {ex.obs && <div style={{fontSize:10, fontStyle:'italic', color:T.muted, marginTop:2}}>"{ex.obs}"</div>}
                  </div>
                ))}
                <button
                  onClick={() => onDelete(profile, h.id)}
                  style={{
                    width:'100%', marginTop:4, padding:'8px',
                    background:'transparent', border:`1px solid #dc262630`,
                    borderRadius:8, fontFamily:T.mono, fontSize:8,
                    letterSpacing:'1.5px', textTransform:'uppercase',
                    color:'#dc2626', cursor:'pointer'
                  }}
                >
                  🗑 REMOVER
                </button>
              </div>
            )}
          </div>
        );
      })}
      <div style={{height:16}}/>
    </div>
  );
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// PAGE: BIO
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function BioPage({ profile, state, onSavePeso, onSaveMetas }) {
  const ac = PROFILE_COLORS[profile];
  const bh = state.bioHistory || [];
  const metas = state.metas;
  const pesoData = state.peso || [];
  const latest = bh[0] || null;

  const [pesoVal, setPesoVal] = useState('');
  const [pesoSaved, setPesoSaved] = useState(false);
  const [metasForm, setMetasForm] = useState({peso:'',gordura:'',massaMagra:'',visceral:''});
  const [metasSaved, setMetasSaved] = useState(false);

  function barPct(cur, meta, goodDown) {
    if (!meta||!cur) return 50;
    const start = goodDown ? meta*1.12 : meta*0.88;
    const range = Math.abs(start-meta);
    const progress = goodDown ? (start-cur)/range : (cur-start)/range;
    return Math.max(3, Math.min(97, progress*100));
  }

  const handleSavePeso = async () => {
    const val = parseFloat(pesoVal);
    if (!val||val<20||val>300) { alert('Peso inválido'); return; }
    await onSavePeso(profile, val);
    setPesoVal('');
    setPesoSaved(true);
    setTimeout(() => setPesoSaved(false), 2000);
  };

  const handleSaveMetas = async () => {
    const {peso,gordura,massaMagra,visceral} = metasForm;
    if (!peso||!gordura||!massaMagra||!visceral) { alert('Preencha todos os campos'); return; }
    await onSaveMetas(profile, {
      peso:parseFloat(peso), gordura:parseFloat(gordura),
      massaMagra:parseFloat(massaMagra), visceral:parseFloat(visceral)
    });
    setMetasSaved(true);
    setTimeout(() => setMetasSaved(false), 2500);
  };

  const metricItems = metas && latest ? [
    {lbl:'Peso',     cur:num(latest.peso),     meta:num(metas.peso),       unit:'kg',  goodDown:true},
    {lbl:'Gordura',  cur:num(latest.gordura),   meta:num(metas.gordura),    unit:'%',   goodDown:true},
    {lbl:'M.Magra',  cur:num(latest.muscEsq),   meta:num(metas.massaMagra), unit:'kg',  goodDown:false},
    {lbl:'Visceral', cur:num(latest.visceral),  meta:num(metas.visceral),   unit:'nív', goodDown:true},
  ] : [];

  return (
    <div className="pb-safe" style={{padding:'16px 16px 0'}}>
      <div style={{fontFamily:T.mono, fontSize:34, fontWeight:900, letterSpacing:'4px', color:T.text, lineHeight:1, marginBottom:4}}>BIOIMPEDÂNCIA</div>
      <div style={{fontSize:12, color:T.dim, marginBottom:20}}>Metas · Peso diário · Histórico</div>

      {/* ── METAS PROGRESS ── */}
      <SLabel>Próxima meta</SLabel>

      {metricItems.length > 0 ? (
        <div style={{
          background:T.surface, border:`1px solid ${T.border}`,
          borderLeft:`2px solid ${ac}`, borderRadius:'0 12px 12px 0',
          padding:'14px 16px', marginBottom:20
        }}>
          <div style={{fontFamily:T.mono, fontSize:8, letterSpacing:'3px', textTransform:'uppercase', color:ac, marginBottom:12}}>
            Ciclo atual
          </div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
            {metricItems.map(({lbl,cur,meta,unit,goodDown}) => {
              const diff = cur-meta;
              const arrived = Math.abs(diff)<0.15;
              const needDown = goodDown?diff>0:diff<0;
              const pct = barPct(cur,meta,goodDown);
              return (
                <div key={lbl} style={{background:T.card, borderRadius:10, padding:'10px 12px'}}>
                  <div style={{fontFamily:T.mono, fontSize:8, letterSpacing:'2px', textTransform:'uppercase', color:T.muted, marginBottom:4}}>{lbl}</div>
                  <div style={{fontFamily:T.mono, fontSize:22, fontWeight:700, lineHeight:1, color:T.text, marginBottom:2}}>
                    {cur?cur.toFixed(1):'—'}
                    <span style={{fontSize:10, fontWeight:400, color:T.muted, marginLeft:2}}>{unit}</span>
                  </div>
                  <div style={{fontFamily:T.mono, fontSize:8, color:T.muted, marginBottom:8}}>meta {meta} {unit}</div>
                  <div style={{height:2, background:T.border, borderRadius:2, overflow:'hidden', marginBottom:5}}>
                    <div style={{height:'100%', borderRadius:2, transition:'width .6s ease', width:`${pct}%`, background:arrived?'#047857':ac}}/>
                  </div>
                  <div style={{fontFamily:T.mono, fontSize:8, color:arrived?'#047857':needDown?'#dc2626':'#047857'}}>
                    {arrived ? '✓ meta atingida' : `${needDown?'▼':'▲'} ${Math.abs(diff).toFixed(1)} ${unit}`}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      ) : (
        <Card style={{textAlign:'center', padding:'28px 20px', marginBottom:20}}>
          <div style={{fontFamily:T.mono, fontSize:9, letterSpacing:'2px', textTransform:'uppercase', color:T.muted}}>
            {!metas ? 'Defina as metas abaixo para ver o progresso' : 'Aguardando dados de bioimpedância'}
          </div>
        </Card>
      )}

      {/* ── PESO DIÁRIO ── */}
      <SLabel>Peso do dia</SLabel>
      <div style={{background:T.surface, border:`1px solid ${T.border}`, borderRadius:12, padding:'14px 16px', marginBottom:20}}>
        <div style={{display:'flex', gap:10, alignItems:'stretch'}}>
          <input
            type="number" inputMode="decimal" step="0.1" placeholder="83.4 kg"
            value={pesoVal} onChange={e=>setPesoVal(e.target.value)}
            style={{
              flex:1, textAlign:'center', fontFamily:T.mono, fontSize:20, fontWeight:700,
              padding:'12px 8px', borderRadius:10, outline:'none',
              background:T.card, border:`1.5px solid ${pesoVal?`${ac}60`:T.border}`,
              color:T.text, transition:'border-color .2s'
            }}
          />
          <button onClick={handleSavePeso} style={{
            padding:'12px 20px', borderRadius:10, border:'none', cursor:'pointer',
            fontFamily:T.mono, fontSize:10, fontWeight:700, letterSpacing:'1.5px', textTransform:'uppercase',
            background: pesoSaved?'#047857':ac, color:'#fff', flexShrink:0, transition:'background .2s'
          }}>
            {pesoSaved?'✓':'SALVAR'}
          </button>
        </div>
        <div style={{fontFamily:T.mono, fontSize:9, color:T.muted, marginTop:8}}>
          {pesoData.length>0
            ? `Último: ${pesoData[0].peso} kg · ${fmtD(pesoData[0].date)}`
            : 'Nenhum registro ainda.'}
        </div>
      </div>

      {/* ── BIO HISTORY ── */}
      <SLabel>Últimas 3 aferições</SLabel>
      {bh.length > 0 ? (
        <>
          {/* Horizontal scroll cards */}
          <div className="no-scroll" style={{display:'flex', gap:10, overflowX:'auto', paddingBottom:4, marginBottom:12}}>
            {bh.map((m,i) => {
              const prev = bh[i+1];
              const isLatest = i===0;
              const fields = [
                {lbl:'Peso',    val:m.peso,     unit:'kg', prevVal:prev?.peso,     goodDown:false},
                {lbl:'Gordura', val:m.gordura,  unit:'%',  prevVal:prev?.gordura,  goodDown:true},
                {lbl:'M.Magra', val:m.muscEsq,  unit:'kg', prevVal:prev?.muscEsq,  goodDown:false},
                {lbl:'Visceral',val:m.visceral, unit:'',   prevVal:prev?.visceral, goodDown:true},
              ];
              return (
                <div key={i} style={{
                  background:T.surface, flexShrink:0, minWidth:150,
                  border:`${isLatest?'1.5px':'1px'} solid ${isLatest?ac:T.border}`,
                  borderRadius:12, padding:'10px 12px'
                }}>
                  {isLatest
                    ? <div style={{fontFamily:T.mono, fontSize:7, letterSpacing:'1px', textTransform:'uppercase', padding:'2px 8px', borderRadius:20, background:`${ac}18`, color:ac, display:'inline-block', marginBottom:8}}>atual</div>
                    : <div style={{height:20}}/>}
                  <div style={{fontFamily:T.mono, fontSize:9, letterSpacing:'1px', textTransform:'uppercase', color:isLatest?ac:T.dim, marginBottom:10}}>{m.date}</div>
                  {fields.map(({lbl,val,unit,prevVal,goodDown}) => {
                    const diff = prevVal!=null ? num(val)-num(prevVal) : null;
                    const good = diff!=null ? (goodDown?diff<=0:diff>=0) : null;
                    return (
                      <div key={lbl} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'4px 0', borderBottom:`0.5px solid ${T.bg}`}}>
                        <span style={{fontFamily:T.mono, fontSize:8, textTransform:'uppercase', color:T.muted}}>{lbl}</span>
                        <span style={{fontFamily:T.mono, fontSize:10, fontWeight:600, color:T.subtle, display:'flex', alignItems:'center', gap:3}}>
                          {val}{unit}
                          {diff!=null && <span style={{fontSize:8, color:good?'#047857':'#dc2626'}}>{diff>0?'▲':'▼'}{Math.abs(diff).toFixed(1)}</span>}
                        </span>
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>

          {/* KPI deltas */}
          {bh.length >= 2 && (
            <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:8, marginBottom:20}}>
              {[
                {lbl:'Peso',    delta:(num(bh[0].peso)   -num(bh[bh.length-1].peso)).toFixed(1),   goodDown:false},
                {lbl:'Gordura', delta:(num(bh[0].gordura)-num(bh[bh.length-1].gordura)).toFixed(1), goodDown:true},
                {lbl:'M.Magra', delta:(num(bh[0].muscEsq)-num(bh[bh.length-1].muscEsq)).toFixed(1),goodDown:false},
              ].map(({lbl,delta,goodDown}) => {
                const n = parseFloat(delta);
                const good = goodDown?n<=0:n>=0;
                return (
                  <Card key={lbl} style={{padding:'8px', textAlign:'center'}}>
                    <div style={{fontFamily:T.mono, fontSize:7, letterSpacing:'2px', textTransform:'uppercase', color:T.muted, marginBottom:4}}>{lbl}</div>
                    <div style={{fontFamily:T.mono, fontSize:18, fontWeight:700, color:good?'#047857':'#dc2626'}}>
                      {n>0?'+':''}{delta}
                    </div>
                  </Card>
                );
              })}
            </div>
          )}
        </>
      ) : (
        <Card style={{textAlign:'center', padding:'28px 20px', marginBottom:20}}>
          <div style={{fontFamily:T.mono, fontSize:9, letterSpacing:'2px', textTransform:'uppercase', color:T.muted}}>
            Dados aparecem após a sincronização
          </div>
        </Card>
      )}

      {/* ── DEFINIR METAS ── */}
      <SLabel>Definir metas</SLabel>
      <div style={{background:T.surface, border:`1px solid ${T.border}`, borderRadius:12, padding:'14px 16px', marginBottom:32}}>
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:12}}>
          {[
            {lbl:'Peso meta (kg)', key:'peso'},
            {lbl:'Gordura (%)',    key:'gordura'},
            {lbl:'Massa magra (kg)',key:'massaMagra'},
            {lbl:'Visceral (nív)', key:'visceral'},
          ].map(({lbl,key}) => (
            <div key={key}>
              <div style={{fontFamily:T.mono, fontSize:8, letterSpacing:'2px', textTransform:'uppercase', color:T.muted, marginBottom:6}}>{lbl}</div>
              <input
                type="number" step="0.1"
                placeholder={metas ? String(metas[key]) : '—'}
                value={metasForm[key]}
                onChange={e => setMetasForm({...metasForm,[key]:e.target.value})}
                style={{
                  width:'100%', textAlign:'center', fontFamily:T.mono, fontSize:16, fontWeight:700,
                  padding:'10px 6px', borderRadius:8, outline:'none',
                  background:T.card, border:`1.5px solid ${metasForm[key]?`${ac}60`:T.border}`,
                  color:T.text, transition:'border-color .2s'
                }}
              />
            </div>
          ))}
        </div>
        <button onClick={handleSaveMetas} style={{
          width:'100%', padding:'13px', borderRadius:10, border:'none', cursor:'pointer',
          fontFamily:T.mono, fontSize:10, fontWeight:700, letterSpacing:'2px', textTransform:'uppercase',
          background: metasSaved?'#047857':ac, color:'#fff', transition:'background .2s'
        }}>
          {metasSaved ? '✓ METAS SALVAS' : 'SALVAR METAS'}
        </button>
      </div>
    </div>
  );
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// LOADING OVERLAY
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function Loading({ text }) {
  return (
    <div style={{
      position:'fixed', inset:0, zIndex:9999,
      background:'rgba(0,0,0,0.97)',
      display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:16
    }}>
      <div style={{
        width:36, height:36, borderRadius:'50%',
        border:`2px solid ${T.border}`, borderTopColor:'var(--ac)',
        animation:'spin 1s linear infinite'
      }}/>
      <div style={{fontFamily:T.mono, fontSize:10, letterSpacing:'3px', textTransform:'uppercase', color:T.dim}}>
        {text || 'SINCRONIZANDO...'}
      </div>
    </div>
  );
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SPLASH SCREEN
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function SplashScreen({ visible }) {
  return (
    <div style={{
      position:'fixed', inset:0, zIndex:10000,
      background:'#000',
      display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
      gap:0,
      opacity: visible ? 1 : 0,
      transition: 'opacity 0.6s ease',
      pointerEvents: visible ? 'auto' : 'none',
    }}>
      {/* Imagem de fundo (opcional) */}
      {SPLASH_IMAGE_URL && (
        <div style={{
          position:'absolute', inset:0,
          backgroundImage:`url(${SPLASH_IMAGE_URL})`,
          backgroundSize:'cover', backgroundPosition:'center',
          opacity:0.35
        }}/>
      )}
      {/* Gradiente sobre a imagem */}
      <div style={{
        position:'absolute', inset:0,
        background:'linear-gradient(to top, #000 30%, transparent 100%)',
      }}/>
      {/* Conteúdo central */}
      <div style={{position:'relative', textAlign:'center', padding:'0 32px'}}>
        <div style={{fontFamily:T.mono, fontSize:9, letterSpacing:'5px', color:'#F59300', textTransform:'uppercase', marginBottom:12, opacity:0.8}}>
          Performance Tracker
        </div>
        <div style={{fontFamily:T.mono, fontSize:40, fontWeight:900, letterSpacing:'8px', color:'#fff', lineHeight:1}}>
          CARLOTA
        </div>
        <div style={{fontFamily:T.mono, fontSize:14, fontWeight:700, letterSpacing:'5px', color:'#F59300', marginTop:6}}>
          QUEEN OF WANDS
        </div>
      </div>
      {/* Loading indicator */}
      <div style={{
        position:'absolute', bottom:80,
        display:'flex', flexDirection:'column', alignItems:'center', gap:12
      }}>
        <div style={{
          width:24, height:24, borderRadius:'50%',
          border:`1.5px solid #333`, borderTopColor:'#F59300',
          animation:'spin 1s linear infinite'
        }}/>
        <div style={{fontFamily:T.mono, fontSize:8, letterSpacing:'3px', textTransform:'uppercase', color:'#444'}}>
          CARREGANDO
        </div>
      </div>
    </div>
  );
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// PIN SCREEN
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function PinScreen({ onUnlock }) {
  const [pin, setPin] = useState('');
  const [error, setError] = useState(false);
  const [shake, setShake] = useState(false);

  const handleDigit = (d) => {
    if (pin.length >= 4 || error) return;
    const next = pin + d;
    setPin(next);
    if (next.length === 4) {
      if (next === APP_PIN) {
        setAuthed('fk');
        onUnlock('fk');
      } else if (next === JRV_PIN) {
        setAuthed('jrv');
        onUnlock('jrv');
      } else {
        setError(true);
        setShake(true);
        setTimeout(() => { setPin(''); setError(false); setShake(false); }, 800);
      }
    }
  };

  const handleDel = () => {
    if (error) return;
    setPin(p => p.slice(0, -1));
  };

  return (
    <div style={{
      position:'fixed', inset:0, zIndex:9999,
      background:'#000',
      display:'flex', flexDirection:'column',
      alignItems:'center', justifyContent:'center',
      gap:0,
    }}>
      {/* Logo */}
      <div style={{textAlign:'center', marginBottom:52}}>
        <div style={{fontFamily:T.mono, fontSize:9, letterSpacing:'5px', color:'#F59300', textTransform:'uppercase', marginBottom:10, opacity:0.7}}>
          Performance Tracker
        </div>
        <div style={{fontFamily:T.mono, fontSize:30, fontWeight:900, letterSpacing:'7px', color:'#fff'}}>
          CARLOTA
        </div>
      </div>

      {/* Label */}
      <div style={{
        fontFamily:T.mono, fontSize:10, letterSpacing:'3px', textTransform:'uppercase',
        color: error ? '#ef4444' : T.muted, marginBottom:24,
        transition:'color .2s'
      }}>
        {error ? 'PIN INCORRETO' : 'Digite o PIN'}
      </div>

      {/* Dots */}
      <div style={{
        display:'flex', gap:14, marginBottom:44,
        animation: shake ? 'pinshake 0.4s ease' : 'none'
      }}>
        {[0,1,2,3].map(i => (
          <div key={i} style={{
            width:13, height:13, borderRadius:'50%',
            background: i < pin.length
              ? (error ? '#ef4444' : '#F59300')
              : '#2c2c2e',
            transition:'background 0.12s ease',
            transform: i < pin.length ? 'scale(1.15)' : 'scale(1)',
          }}/>
        ))}
      </div>

      {/* Keypad */}
      <div style={{display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:10, width:252}}>
        {[1,2,3,4,5,6,7,8,9,'','0','⌫'].map((d, i) => {
          const isEmpty = d === '';
          const isDel   = d === '⌫';
          return (
            <button
              key={i}
              onClick={() => isDel ? handleDel() : !isEmpty ? handleDigit(String(d)) : undefined}
              style={{
                height:70, borderRadius:14,
                background: isEmpty ? 'transparent' : isDel ? 'transparent' : '#1c1c1e',
                border: isEmpty ? 'none' : isDel ? 'none' : '1px solid #2c2c2e',
                color: isDel ? T.muted : '#fff',
                fontSize: isDel ? 20 : 24,
                fontFamily:T.mono, fontWeight:600,
                cursor: isEmpty ? 'default' : 'pointer',
                transition:'background 0.1s, transform 0.05s',
                WebkitTapHighlightColor:'transparent',
              }}
              onMouseDown={e => { if (!isEmpty) e.currentTarget.style.background = isDel?'transparent':'#2c2c2e'; }}
              onMouseUp={e => { if (!isEmpty) e.currentTarget.style.background = isDel?'transparent':'#1c1c1e'; }}
            >
              {d}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// CSS para shake animation do PIN
const pinStyle = document.createElement('style');
pinStyle.textContent = `@keyframes pinshake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }`;
document.head.appendChild(pinStyle);

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// ROOT APP
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function App() {
  const [profile, setProfile]   = useState('fk');
  const [activeTab, setActiveTab] = useState('prog');
  const [syncStatus, setSyncStatus] = useState('idle');
  const [savingWk, setSavingWk] = useState(null);
  // Auth / splash flow: 'splash' → 'pin' → 'app'
  const [screen, setScreen] = useState('splash');
  const [splashVisible, setSplashVisible] = useState(true);
  // Rastreia quais perfis já foram carregados (evita re-fetch desnecessário)
  const [loadedProfiles, setLoadedProfiles] = useState(new Set());
  const [activeWk, setActiveWk] = useState(0); // compartilhado entre perfis
  const [state, setState] = useState({
    fk:  {hist:[],healthkit:[],bodyComp:[],bioHistory:[],metas:null,insights:[]},
    jrv: {hist:[],healthkit:[],bodyComp:[],bioHistory:[],metas:null,insights:[]},
  });

  // Sync CSS accent color on profile change
  useEffect(() => {
    document.documentElement.style.setProperty('--ac', PROFILE_COLORS[profile]);
  }, [profile]);

  async function syncDown(p) {
    setSyncStatus('syncing');
    try {
      const [wR,hkR,bcR,mR,bhR,inR] = await Promise.all([
        apiGet('list',p), apiGet('listHealthKit',p),
        apiGet('listBodyComp',p), apiGet('getMetas',p),
        apiGet('getBioHistory',p), apiGet('listInsights',p),
      ]);
      setState(prev => ({...prev, [p]: {
        hist:       wR.ok  ? (wR.data||[]).sort((a,b)=>new Date(b.date)-new Date(a.date)) : prev[p].hist,
        healthkit:  hkR.ok ? hkR.data||[]  : prev[p].healthkit,
        bodyComp:   bcR.ok ? bcR.data||[]  : prev[p].bodyComp,
        bioHistory: bhR.ok ? bhR.data||[]  : prev[p].bioHistory,
        metas:      mR.ok  ? mR.data||null : prev[p].metas,
        insights:   inR.ok ? inR.data||[]  : prev[p].insights,
      }}));
      setSyncStatus('ok');
      setLoadedProfiles(prev => new Set([...prev, p]));
    } catch(e) { setSyncStatus('error'); }
  }

  // Initial load — carrega o perfil ativo primeiro, o outro em background
  useEffect(() => {
    (async () => {
      const activeProfile = isAuthed() ? getAuthedProfile() : 'fk';
      const otherProfile  = activeProfile === 'fk' ? 'jrv' : 'fk';

      // Sincroniza perfil ativo + splash em paralelo (bloqueante)
      await Promise.all([
        syncDown(activeProfile),
        new Promise(r => setTimeout(r, 1400)),
      ]);

      // Fade out splash
      setSplashVisible(false);
      await new Promise(r => setTimeout(r, 600));

      // Determina próxima tela
      if (isAuthed()) {
        setProfile(getAuthedProfile());
        setScreen('app');
      } else {
        setScreen('pin');
      }

      // Sincroniza o outro perfil em background (não bloqueante)
      syncDown(otherProfile);
    })();
  }, []);

  const handleProfileSwitch = async (p) => {
    if (p === profile) return;
    localStorage.setItem('carlota_profile', p); // lembra perfil para próximo reload
    setProfile(p); // troca imediata — sem tela de loading bloqueante

    // Só faz fetch se este perfil ainda não foi carregado
    if (!loadedProfiles.has(p)) {
      setSyncStatus('syncing');
      await syncDown(p);
    }
  };

  const handleSaveWorkout = async (p, wkIdx) => {
    const wks = p==='fk' ? FK_WK : JRV_WK;
    const wk = wks[wkIdx];
    const ac = PROFILE_COLORS[p];
    const exData = [];
    let hasData = false;

    wk.ex.forEach((ex, i) => {
      try {
        const raw = localStorage.getItem(`cw_${p}_${wkIdx}_${i}`);
        if (!raw) return;
        const d = JSON.parse(raw);

        if (ex.type === 'biset') {
          const rounds = (d.sets||[])
            .filter(r => r.items && r.items.some(it => it.kg || it.reps))
            .map((r,j) => ({round:j+1, items:r.items}));
          if (rounds.length) {
            hasData = true;
            exData.push({ n:ex.n, type:'biset', names:ex.exercises.map(e=>e.name), rounds, obs:d.obs||'' });
          }
          return;
        }

        const sets = (d.sets||[])
          .filter(s => s.kg || s.reps || (s.drops && s.drops.some(dr=>dr.kg||dr.reps)))
          .map((s,j)=>({s:j+1,...s}));
        if (sets.length) { hasData=true; exData.push({n:ex.n, name:ex.name, sets, obs:d.obs||''}); }
      } catch(e) {}
    });

    if (!hasData) { alert('Registre pelo menos uma carga antes de salvar.'); return; }

    const key = `${p}-${wkIdx}`;
    setSavingWk(key);
    const entry = {
      id: Date.now(), wkId:wk.id, title:wk.title,
      zone:wk.zone, zc:ac, date:new Date().toISOString(), exercises:exData
    };
    await apiPost({action:'saveWorkout', profile:p, workout:entry});
    setState(prev => ({...prev, [p]: {...prev[p], hist:[entry,...prev[p].hist]}}));

    setTimeout(() => {
      setSavingWk(null);
      wk.ex.forEach((_,i) => {
        try { localStorage.removeItem(`cw_${p}_${wkIdx}_${i}`); } catch(e) {}
      });
    }, 2200);
  };

  const handleSaveCustomWorkout = async (p, exercises, zone) => {
    if (!exercises.length) { alert('Adicione pelo menos um exercício.'); return; }
    const ac = PROFILE_COLORS[p];
    const exData = exercises
      .map((ex, i) => {
        const sets = (ex.sets||[])
          .filter(s => s.done || s.kg || s.reps)
          .map((s, j) => ({s:j+1, kg:s.kg||'', reps:s.reps||'', done:s.done||false}));
        return sets.length ? {n:String(i+1).padStart(2,'0'), name:ex.name, sets, obs:ex.obs||''} : null;
      })
      .filter(Boolean);

    if (!exData.length) { alert('Registre pelo menos uma série antes de salvar.'); return; }

    const key = `${p}-CUSTOM`;
    setSavingWk(key);
    const entry = {
      id: Date.now(), wkId:'CUSTOM', title:'Personalizado',
      zone, zc:ac, date:new Date().toISOString(), exercises:exData
    };
    await apiPost({action:'saveWorkout', profile:p, workout:entry});
    setState(prev => ({...prev, [p]: {...prev[p], hist:[entry,...prev[p].hist]}}));

    setTimeout(() => {
      setSavingWk(null);
      try { localStorage.removeItem(`cw_${p}_CUSTOM`); } catch(e) {}
    }, 2200);
  };

  const handleDeleteHist = async (p, id) => {
    if (!confirm('Remover este registro?')) return;
    setState(prev => ({...prev, [p]: {...prev[p], hist:prev[p].hist.filter(h=>String(h.id)!==String(id))}}));
    await apiPost({action:'delWorkout', profile:p, id});
  };

  const handleSaveMetas = async (p, metas) => {
    await apiPost({action:'saveMetas', profile:p, metas});
    setState(prev => ({...prev, [p]: {...prev[p], metas}}));
  };

  // Telas de splash e PIN ficam fora do layout principal
  if (screen === 'splash') {
    return <SplashScreen visible={splashVisible} />;
  }
  if (screen === 'pin') {
    return <PinScreen onUnlock={(p) => { setProfile(p); setScreen('app'); }} />;
  }

  return (
    <div style={{maxWidth:480, margin:'0 auto', minHeight:'100vh', background:T.bg, position:'relative'}}>
      <Header
        profile={profile}
        syncStatus={syncStatus}
        onSwitch={handleProfileSwitch}
      />

      <main style={{background:T.bg}}>
        {activeTab==='prog'   && <ProgPage   profile={profile} state={state[profile]} onSaveMetas={handleSaveMetas} />}
        {activeTab==='treino' && <TreinoPage profile={profile} state={state[profile]} onSave={handleSaveWorkout} onSaveCustom={handleSaveCustomWorkout} savingWk={savingWk} activeWk={activeWk} setActiveWk={setActiveWk} />}
        {activeTab==='hist'   && <HistPage   profile={profile} state={state[profile]} onDelete={handleDeleteHist} />}
      </main>

      <BottomNav active={activeTab} onChange={setActiveTab} profile={profile} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
