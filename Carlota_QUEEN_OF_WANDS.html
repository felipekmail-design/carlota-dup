const AUTH_DURATION_MS = 30 * 24 * 60 * 60 * 1000; // 30 dias
function isAuthed() {
  const exp = localStorage.getItem('carlota_auth');
  return exp && Date.now() < Number(exp);
}
function getAuthedProfile() {
  return localStorage.getItem('carlota_profile') || 'fk';
}

  localStorage.setItem('carlota_auth',   String(Date.now() + AUTH_DURATION_MS));

}

// UTILS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function fmtDate(iso) {
  const d = new Date(iso), now = new Date();
  const diff = Math.floor((now - d) / 86400000);
  if (diff === 0) return 'hoje';
  if (diff === 1) return 'ontem';
  if (diff < 7)  return `há ${diff}d`;
  if (diff < 14) return 'há 1 sem';
  if (diff < 30) return `há ${Math.floor(diff/7)} sem`;
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
}
function fmtD(d) {
  if (!d) return '—';
  const s = String(d);
  // Data pura "yyyy-MM-dd" — parsear sem conversão de timezone
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
    const [y, m, day] = s.split('-');
    return `${day}/${m}/${y.slice(2)}`;
  }
  if (s.includes('T') || s.includes('-')) {
    const dt = new Date(s);
    return isNaN(dt) ? s : dt.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'2-digit'});
  }
  return s;
}
function fmtN(v) {
  const n = parseFloat(String(v||'0').replace(',','.'));
  return (!n || n <= 0) ? '—' : Math.round(n).toLocaleString('pt-BR');
}
function num(v) { return parseFloat(String(v||'0').replace(',','.')) || 0; }

// ── RECOVERY SCORE ─────────────────────────────────────────────────────────
// Calcula um score 0–100 baseado em HRV, FC repouso, recência de treino e zona.
function calcRecoveryScore(healthkit, hist) {
  if (!healthkit || healthkit.length === 0) return null;
  const latest = healthkit[0];
  const hrv = num(latest.hrv);
  const rhr = num(latest.restingHR);
  if (hrv <= 0 && rhr <= 0) return null;

  // Médias dos últimos 7 dias (excluindo hoje)
  const past = healthkit.slice(1, 8);
  const hrvVals = past.map(h => num(h.hrv)).filter(v => v > 0);
  const rhrVals = past.map(h => num(h.restingHR)).filter(v => v > 0);
  const hrvAvg = hrvVals.length ? hrvVals.reduce((a,b) => a+b, 0) / hrvVals.length : hrv;
  const rhrAvg = rhrVals.length ? rhrVals.reduce((a,b) => a+b, 0) / rhrVals.length : rhr;

  // Fator 1: HRV (0–35 pts) — HRV acima da média = melhor recuperação
  let hrvPts = 17.5;
  if (hrv > 0 && hrvAvg > 0) {
    const ratio = hrv / hrvAvg; // 1.0 = na média
    hrvPts = Math.max(0, Math.min(35, 17.5 + (ratio - 1) * 87.5));
  }

  // Fator 2: FC Repouso (0–25 pts) — FC menor = melhor recuperação
  let rhrPts = 12.5;
  if (rhr > 0 && rhrAvg > 0) {
    const ratio = rhr / rhrAvg; // <1 = abaixo da média = bom
    rhrPts = Math.max(0, Math.min(25, 12.5 + (1 - ratio) * 62.5));
  }

  // Fator 3: Recência de treino (0–25 pts)
  let recencyPts = 20;
  if (hist && hist.length > 0) {
    const fmt = d => new Date(d).toLocaleDateString('en-CA', {timeZone:'America/Sao_Paulo'});
    const daysSince = Math.round((new Date(fmt(Date.now())) - new Date(fmt(hist[0].date))) / 86400000);
    if      (daysSince === 0) recencyPts = 12; // treinou hoje
    else if (daysSince === 1) recencyPts = 17; // ontem
    else if (daysSince === 2) recencyPts = 22; // 2 dias
    else if (daysSince >= 3 && daysSince <= 5) recencyPts = 25; // ideal
    else                      recencyPts = 15; // >5 dias sem treinar
  }

  // Fator 4: Zona do último treino (0–15 pts)
  let zonePts = 10;
  if (hist && hist.length > 0) {
    const z = hist[0].zone;
    if      (z === 'METABÓLICO')  zonePts = 14;
    else if (z === 'HIPERTROFIA') zonePts = 10;
    else if (z === 'FORÇA')       zonePts = 6;
  }

  return Math.max(0, Math.min(100, Math.round(hrvPts + rhrPts + recencyPts + zonePts)));
}

function recoveryLabel(score) {
  if (score === null) return null;
  if (score >= 70) return { label: 'PRONTO', color: '#047857', bg: '#04785712' };
  if (score >= 40) return { label: 'MODERADO', color: '#d97706', bg: '#d9770612' };
  return { label: 'RECUPERAR', color: '#dc2626', bg: '#dc262612' };
}

// EXERCISE CARD
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function ExCard({ ex, profile, wkIdx, exIdx, ac, lastRef, isOpen, onToggle }) {
  const draftKey = `cw_${profile}_${wkIdx}_${exIdx}`;
  const isBiset = ex.type === 'biset';
  const hasDropset = !isBiset && !!ex.dropset;

  const initSets = () => {
    try {
      const raw = localStorage.getItem(draftKey);
      if (raw) return JSON.parse(raw).sets;
    } catch(e) {}
    if (isBiset) {
      return Array.from({length: ex.sets}, () => ({
        items: ex.exercises.map(() => ({kg:'', reps:''})),
        done: false
      }));
    }
    return Array.from({length: ex.sets}, (_, i) => ({
      kg:'', reps:'', done:false,
      ...(hasDropset && (i+1)===ex.dropset.onSet
        ? {drops: Array.from({length: ex.dropset.maxDrops}, () => ({kg:'', reps:''}))}
        : {})
    }));
  };
  const initObs = () => {
    try {
      const raw = localStorage.getItem(draftKey);
      if (raw) return JSON.parse(raw).obs || '';
    } catch(e) {}
    return '';
  };

  const [sets, setSets] = useState(initSets);
  const [obs, setObs] = useState(initObs);

  const save = useCallback((s, o) => {
    try { localStorage.setItem(draftKey, JSON.stringify({sets:s, obs:o})); } catch(e) {}
  }, [draftKey]);

  const updateSet = (i, field, val) => {
    const next = sets.map((s,si) => si===i ? {...s,[field]:val} : s);
    setSets(next); save(next, obs);
  };
  const updateDrop = (i, di, field, val) => {
    const next = sets.map((s,si) => {
      if (si !== i) return s;
      const drops = s.drops.map((d,dj) => dj===di ? {...d,[field]:val} : d);
      return {...s, drops};
    });
    setSets(next); save(next, obs);
  };
  const updateRoundItem = (ri, si, field, val) => {
    const next = sets.map((round,rj) => {
      if (rj !== ri) return round;
      const items = round.items.map((it,ij) => ij===si ? {...it,[field]:val} : it);
      return {...round, items};
    });
    setSets(next); save(next, obs);
  };
  const toggleDone = (i) => {
    const next = sets.map((s, si) => {
      if (si !== i) return s;
      if (!s.done) {
        // marcando como feito — preenche campos vazios com o valor do placeholder
        const phKg   = String(lastRef?.sets?.find(ls => ls.s === i+1)?.kg   || '');
        const phReps = String(lastRef?.sets?.find(ls => ls.s === i+1)?.reps || ex.rT || '');
        return { ...s, done: true, kg: s.kg || phKg, reps: s.reps || phReps };
      }
      return { ...s, done: false };
    });
    setSets(next); save(next, obs);
  };
  const toggleRoundDone = (ri) => {
    const next = sets.map((round, rj) => rj===ri ? {...round, done: !round.done} : round);
    setSets(next); save(next, obs);
  };
  const clear = () => {
    const next = isBiset
      ? Array.from({length: ex.sets}, () => ({ items: ex.exercises.map(() => ({kg:'', reps:''})), done:false }))
      : Array.from({length:ex.sets}, (_, i) => ({
          kg:'',reps:'',done:false,
          ...(hasDropset && (i+1)===ex.dropset.onSet
            ? {drops: Array.from({length: ex.dropset.maxDrops}, () => ({kg:'', reps:''}))}
            : {})
        }));
    setSets(next); setObs(''); save(next,'');
  };

  const done = sets.filter(s=>s.done).length;
  const leftColor = (ex.alert || (isBiset && ex.exercises.some(e=>e.alert))) ? '#f59e0b' : ex.primary ? ac : T.border;
  const displayName = isBiset ? ex.exercises.map(e=>e.name).join(' + ') : ex.name;
  const techBadge = isBiset ? (ex.exercises.length >= 3 ? 'TRI-SET' : 'BI-SET') : (hasDropset ? 'DROP-SET' : null);

  return (
    <div style={{
      background: T.surface, borderRadius:'0 12px 12px 0',
      border:`1px solid ${T.border}`, borderLeft:`2px solid ${leftColor}`,
      marginBottom:8, overflow:'hidden'
    }}>
      {/* Toggle button */}
      <button onClick={onToggle} style={{
        width:'100%', textAlign:'left', background:'transparent',
        border:'none', cursor:'pointer', padding:'12px 14px 10px'
      }}>
        <div style={{display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:10}}>
          <div style={{flex:1, minWidth:0}}>
            <div style={{fontFamily:T.mono, fontSize:10, letterSpacing:'2px', color:T.muted, textTransform:'uppercase', marginBottom:3}}>
              EX {ex.n}
              {done > 0 && <span style={{color:ac, marginLeft:6}}>{done===ex.sets ? '✓' : `${done}/${ex.sets}`}</span>}
              {techBadge && <span style={{color:ac, marginLeft:6, opacity:.8}}>· {techBadge}</span>}
            </div>
            <div style={{fontSize:13, fontWeight:600, color:T.text, lineHeight:1.35, marginBottom:8}}>{displayName}</div>
            <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
              <span style={{
                fontFamily:T.mono, fontSize:10, padding:'3px 8px', borderRadius:4,
                background:`${ac}18`, color:ac, border:`1px solid ${ac}30`
              }}>{ex.sets}×{isBiset ? ex.exercises.map(e=>e.rT).join('/') : ex.rT}</span>
              <span style={{
                fontFamily:T.mono, fontSize:10, padding:'3px 8px', borderRadius:4,
                background:T.card, color:T.dim, border:`1px solid ${T.border}`
              }}>⏱ {ex.rest}</span>
            </div>
          </div>
          <div style={{fontFamily:T.mono, fontSize:10, color:T.muted, marginTop:2, flexShrink:0}}>
            {isOpen ? '▲' : '▼'}
          </div>
        </div>
        {isBiset ? (
          ex.exercises.map((subEx, si) => (
            (subEx.note || subEx.alert) ? (
              <div key={si} style={{marginTop:8}}>
                <div style={{fontSize:10, color:T.subtle, fontWeight:600, marginBottom:2}}>{subEx.name}</div>
                {subEx.note && <div style={{fontSize:10, color:T.dim, lineHeight:1.6}}>{subEx.note}</div>}
                {subEx.alert && (
                  <div style={{
                    fontSize:10, marginTop:4, padding:'6px 10px', borderRadius:6,
                    background:'#f59e0b0d', border:'1px solid #f59e0b28', color:'#f59e0b',
                    display:'flex', gap:6, lineHeight:1.5
                  }}>⚠ {subEx.alert}</div>
                )}
              </div>
            ) : null
          ))
        ) : (
          <>
            {ex.note && (
              <div style={{fontSize:10, color:T.dim, lineHeight:1.6, marginTop:8}}>{ex.note}</div>
            )}
            {ex.alert && (
              <div style={{
                fontSize:10, marginTop:8, padding:'6px 10px', borderRadius:6,
                background:'#f59e0b0d', border:'1px solid #f59e0b28', color:'#f59e0b',
                display:'flex', gap:6, lineHeight:1.5
              }}>⚠ {ex.alert}</div>
            )}
          </>
        )}
      </button>

      {/* Log body */}
      {isOpen && (
        <div className="anim-fadein" style={{
          borderTop:`1px solid ${T.border}`, background:T.bg,
          padding:'12px 14px 14px'
        }}>
          {/* Previous reference — só pra exercícios normais (bi-set ainda não tem histórico comparável) */}
          {!isBiset && lastRef && (
            <div style={{
              padding:'8px 10px', borderRadius:8, marginBottom:10,
              background:'#d9770608', border:'1px solid #d9770620'
            }}>
              <div style={{fontFamily:T.mono, fontSize:10, letterSpacing:'2px', color:'#a16207', textTransform:'uppercase', marginBottom:3}}>
                🕐 última vez · {fmtDate(lastRef.date)}
              </div>
              <div style={{fontFamily:T.mono, fontSize:10, color:'#78450c', lineHeight:1.6}}>
                {lastRef.sets?.map(s=>`S${s.s}:${s.kg||'?'}kg×${s.reps||'?'}`).join(' · ')}
              </div>
            </div>
          )}

          {isBiset ? (
            sets.map((round, ri) => (
              <div key={ri} style={{
                marginBottom:10, padding:10, borderRadius:8,
                border:`1.5px solid ${round.done?`${ac}40`:T.border}`,
                background: round.done ? `${ac}0a` : T.card
              }}>
                <div style={{fontFamily:T.mono, fontSize:10, letterSpacing:'2px', color:T.muted, textTransform:'uppercase', marginBottom:8}}>
                  RODADA {ri+1}
                </div>
                {ex.exercises.map((subEx, si) => (
                  <div key={si} style={{marginBottom:8}}>
                    <div style={{fontSize:11, color:T.subtle, marginBottom:4}}>{subEx.name}</div>
                    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:6}}>
                      <input
                        type="number" inputMode="decimal" placeholder="kg"
                        value={round.items[si].kg} onChange={e => updateRoundItem(ri, si, 'kg', e.target.value)}
                        style={{
                          background:T.surface, border:`1.5px solid ${round.done?`${ac}40`:T.border}`,
                          borderRadius:8, padding:'8px 4px', fontFamily:T.mono,
                          fontSize:14, fontWeight:600, color:round.done?T.dim:T.text,
                          textAlign:'center', outline:'none', width:'100%',
                          opacity: round.done ? 0.4 : 1, transition:'all .15s'
                        }}
                      />
                      <input
                        type="number" inputMode="numeric" placeholder={subEx.rT}
                        value={round.items[si].reps} onChange={e => updateRoundItem(ri, si, 'reps', e.target.value)}
                        style={{
                          background:T.surface, border:`1.5px solid ${round.done?`${ac}40`:T.border}`,
                          borderRadius:8, padding:'8px 4px', fontFamily:T.mono,
                          fontSize:14, fontWeight:600, color:round.done?T.dim:T.text,
                          textAlign:'center', outline:'none', width:'100%',
                          opacity: round.done ? 0.4 : 1, transition:'all .15s'
                        }}
                      />
                    </div>
                  </div>
                ))}
                <button onClick={() => toggleRoundDone(ri)} style={{
                  width:'100%', padding:'8px', borderRadius:8,
                  border:`1.5px solid ${round.done?ac:T.border}`,
                  background:round.done?ac:T.surface, color:round.done?'#fff':T.muted,
                  fontFamily:T.mono, fontSize:10, fontWeight:700, letterSpacing:'1px', textTransform:'uppercase',
                  cursor:'pointer', transition:'all .15s'
                }}>
                  {round.done ? '✓ rodada feita' : 'marcar rodada feita'}
                </button>
              </div>
            ))
          ) : (
            <>
              {/* Column headers */}
              <div style={{
                display:'grid', gridTemplateColumns:'22px 1fr 1fr 38px',
                gap:6, marginBottom:6
              }}>
                {['','KG','REPS',''].map((h,i) => (
                  <div key={i} style={{fontFamily:T.mono, fontSize:10, letterSpacing:'2px', color:T.muted, textAlign:'center', textTransform:'uppercase'}}>{h}</div>
                ))}
              </div>

              {/* Set rows */}
              {sets.map((s, i) => (
                <React.Fragment key={i}>
                  <div style={{display:'grid', gridTemplateColumns:'22px 1fr 1fr 38px', gap:6, marginBottom:6, alignItems:'center'}}>
                    <div style={{fontFamily:T.mono, fontSize:13, fontWeight:700, textAlign:'center', color:s.done?ac:T.muted}}>{i+1}</div>
                    <input
                      type="number" inputMode="decimal"
                      placeholder={lastRef?.sets?.find(ls => ls.s === i+1)?.kg || '—'}
                      value={s.kg} onChange={e => updateSet(i,'kg',e.target.value)}
                      style={{
                        background:T.card, border:`1.5px solid ${s.done?`${ac}40`:T.border}`,
                        borderRadius:8, padding:'10px 4px', fontFamily:T.mono,
                        fontSize:15, fontWeight:600, color:s.done?T.dim:T.text,
                        textAlign:'center', outline:'none', width:'100%',
                        opacity: s.done ? 0.4 : 1, transition:'all .15s'
                      }}
                    />
                    <input
                      type="number" inputMode="numeric" placeholder={lastRef?.sets?.find(ls => ls.s === i+1)?.reps || ex.rT}
                      value={s.reps} onChange={e => updateSet(i,'reps',e.target.value)}
                      style={{
                        background:T.card, border:`1.5px solid ${s.done?`${ac}40`:T.border}`,
                        borderRadius:8, padding:'10px 4px', fontFamily:T.mono,
                        fontSize:15, fontWeight:600, color:s.done?T.dim:T.text,
                        textAlign:'center', outline:'none', width:'100%',
                        opacity: s.done ? 0.4 : 1, transition:'all .15s'
                      }}
                    />
                    <button onClick={() => toggleDone(i)} style={{
                      width:38, height:40, borderRadius:8, border:`1.5px solid ${s.done?ac:T.border}`,
                      background:s.done?ac:T.card, color:s.done?'#fff':T.muted,
                      fontSize:14, fontWeight:700, cursor:'pointer', transition:'all .15s',
                      display:'flex', alignItems:'center', justifyContent:'center'
                    }}>
                      {s.done ? '✓' : '○'}
                    </button>
                  </div>
                  {s.drops && (
                    <div style={{marginBottom:8, marginLeft:28, padding:'6px 8px', borderRadius:8, border:`1px dashed ${T.border}`}}>
                      <div style={{fontFamily:T.mono, fontSize:9, letterSpacing:'1.5px', color:'#f59e0b', textTransform:'uppercase', marginBottom:6}}>
                        ↓ Drop-set — carga digitada na hora
                      </div>
                      {s.drops.map((d, di) => (
                        <div key={di} style={{display:'grid', gridTemplateColumns:'50px 1fr 1fr', gap:6, marginBottom:6, alignItems:'center'}}>
                          <div style={{fontFamily:T.mono, fontSize:9, color:T.muted}}>DROP {di+1}</div>
                          <input
                            type="number" inputMode="decimal" placeholder="kg"
                            value={d.kg} onChange={e => updateDrop(i, di, 'kg', e.target.value)}
                            style={{
                              background:T.card, border:`1px solid ${T.border}`,
                              borderRadius:6, padding:'7px 4px', fontFamily:T.mono,
                              fontSize:13, fontWeight:600, color:T.text,
                              textAlign:'center', outline:'none', width:'100%'
                            }}
                          />
                          <input
                            type="number" inputMode="numeric" placeholder="reps"
                            value={d.reps} onChange={e => updateDrop(i, di, 'reps', e.target.value)}
                            style={{
                              background:T.card, border:`1px solid ${T.border}`,
                              borderRadius:6, padding:'7px 4px', fontFamily:T.mono,
                              fontSize:13, fontWeight:600, color:T.text,
                              textAlign:'center', outline:'none', width:'100%'
                            }}
                          />
                        </div>
                      ))}
                    </div>
                  )}
                </React.Fragment>
              ))}
            </>
          )}

          <textarea
            value={obs}
            onChange={e => { setObs(e.target.value); save(sets, e.target.value); }}
            placeholder="Observações..."
            rows={2}
            style={{
              width:'100%', marginTop:8, padding:'8px 10px',
              background:T.card, border:`1px solid ${T.border}`,
              borderRadius:8, fontFamily:'Geist, sans-serif', fontSize:11,
              color:T.subtle, resize:'none', outline:'none', lineHeight:1.5
            }}
          />
          <button onClick={clear} style={{
            marginTop:8, width:'100%', padding:'7px',
            background:'transparent', border:`1px solid ${T.border}`,
            borderRadius:8, fontFamily:T.mono, fontSize:8,
            letterSpacing:'1px', textTransform:'uppercase', color:T.muted,
            cursor:'pointer'
          }}>↺ LIMPAR</button>
        </div>
      )}
    </div>
  );
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// RECOVERY SCORE CARD
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function RecoveryScoreCard({ score, healthkit, hist, ac }) {
  const info = recoveryLabel(score);
  if (!info) return null;

  const latest = healthkit[0] || {};
  const hrv = num(latest.hrv);
  const rhr = num(latest.restingHR);
  const past = healthkit.slice(1, 8);
  const hrvVals = past.map(h => num(h.hrv)).filter(v => v > 0);
  const rhrVals = past.map(h => num(h.restingHR)).filter(v => v > 0);
  const hrvAvg = hrvVals.length ? Math.round(hrvVals.reduce((a,b) => a+b) / hrvVals.length) : null;
  const rhrAvg = rhrVals.length ? Math.round(rhrVals.reduce((a,b) => a+b) / rhrVals.length) : null;
  const daysSince = hist && hist.length > 0
    ? (() => {
        const fmt = d => new Date(d).toLocaleDateString('en-CA', {timeZone:'America/Sao_Paulo'});
        const todayStr = fmt(Date.now());
        const lastStr  = fmt(hist[0].date);
        return Math.round((new Date(todayStr) - new Date(lastStr)) / 86400000);
      })()
    : null;
  const lastZone  = hist && hist.length > 0 ? hist[0].zone  : null;
  const lastTitle = hist && hist.length > 0 ? (hist[0].title || hist[0].wkId || null) : null;
  const zc = lastZone ? (ZONE_COLORS[lastZone] || ac) : ac;

  const pct = score; // 0–100

  return (
    <div style={{
      background: T.surface,
      border: `1px solid ${info.color}40`,
      borderLeft: `3px solid ${info.color}`,
      borderRadius: '0 14px 14px 0',
      padding: '16px 16px 14px',
      marginBottom: 20,
      position: 'relative', overflow: 'hidden'
    }}>
      {/* Background arc decoration */}
      <div style={{
        position: 'absolute', top: -30, right: -30,
        width: 120, height: 120, borderRadius: '50%',
        background: `${info.color}08`, pointerEvents: 'none'
      }}/>

      {/* Top row */}
      <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 12 }}>
        <div>
          <div style={{ fontFamily: T.mono, fontSize: 9, letterSpacing: '3px', textTransform: 'uppercase', color: T.muted, marginBottom: 4 }}>
            Índice de Prontidão
          </div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
            <span style={{ fontFamily: T.mono, fontSize: 52, fontWeight: 900, lineHeight: 1, color: info.color }}>
              {score}
            </span>
            <span style={{ fontFamily: T.mono, fontSize: 14, color: T.muted }}>/100</span>
          </div>
        </div>
        <div style={{
          padding: '5px 12px', borderRadius: 20,
          background: info.bg, border: `1px solid ${info.color}40`,
          fontFamily: T.mono, fontSize: 9, letterSpacing: '2px',
          textTransform: 'uppercase', color: info.color, marginTop: 4
        }}>
          ● {info.label}
        </div>
      </div>

      {/* Score bar */}
      <div style={{ height: 4, background: T.border, borderRadius: 2, marginBottom: 14, overflow: 'hidden' }}>
        <div style={{
          height: '100%', borderRadius: 2,
          width: `${pct}%`,
          background: `linear-gradient(90deg, #dc2626, #d97706 40%, #047857)`,
          transition: 'width 1s ease'
        }}/>
      </div>

      {/* Insight científico dinâmico */}
      {(() => {
        const hrvRatio = hrv > 0 && hrvAvg ? hrv / hrvAvg : null;
        const rhrRatio = rhr > 0 && rhrAvg ? rhr / rhrAvg : null;
        let txt = '';
        if (score >= 70) {
          if (hrvRatio && hrvRatio > 1.15) txt = 'HRV significativamente acima da média — sistema nervoso parassimpático ativo. Janela ideal para alta intensidade ou volume elevado.';
          else if (rhrRatio && rhrRatio < 0.95) txt = 'FC de repouso abaixo da sua média — coração mais eficiente. Boa recuperação cardiovascular confirmada.';
          else txt = 'Métricas autonômicas estáveis e dentro da janela ótima. Condição favorável para treino de qualidade.';
        } else if (score >= 40) {
          if (daysSince === 0) txt = 'Treino recente detectado — musculatura ainda em fase de reparação (síntese proteica ativa nas próximas 24–48h). Volume moderado recomendado.';
          else if (rhrRatio && rhrRatio > 1.06) txt = 'FC repouso acima da média — sinal clássico de estresse cumulativo ou sono inadequado. Priorize recuperação.';
          else if (hrvRatio && hrvRatio < 0.85) txt = 'HRV suprimido — sistema nervoso ainda sob carga. Reduza intensidade e monitore qualidade do sono.';
          else txt = 'Recuperação parcial. Intensidade e volume moderados preservam a adaptação sem sobrecarga adicional.';
        } else {
          txt = 'HRV abaixo da média — atividade simpática elevada indica fadiga acumulada. Treino leve ou descanso ativo protege a adaptação a longo prazo.';
        }
        return (
          <div style={{ fontSize: 11, color: T.dim, lineHeight: 1.6, marginBottom: 12, paddingTop: 2 }}>
            {txt}
          </div>
        );
      })()}

      {/* Fatores */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
        {[
          {
            lbl: 'HRV hoje',
            val: hrv > 0 ? `${Math.round(hrv)} ms` : '—',
            sub: hrvAvg ? `média 7d: ${hrvAvg} ms` : '',
            good: hrv > 0 && hrvAvg ? hrv >= hrvAvg * 0.97 : null,
          },
          {
            lbl: 'FC Repouso',
            val: rhr > 0 ? `${Math.round(rhr)} bpm` : '—',
            sub: rhrAvg ? `média 7d: ${rhrAvg} bpm` : '',
            good: rhr > 0 && rhrAvg ? rhr <= rhrAvg * 1.03 : null,
          },
          {
            lbl: 'Último treino',
            val: daysSince === null ? '—' : daysSince === 0 ? 'hoje' : daysSince === 1 ? 'ontem' : `há ${daysSince}d`,
            sub: daysSince === null ? ''
               : daysSince === 0   ? 'músculo em reparo'
               : daysSince === 1   ? 'recuperação ativa'
               : daysSince <= 5    ? 'janela ideal'
               : 'retomar treino',
            good: null,
            color: daysSince === null ? T.subtle
                 : daysSince >= 2 && daysSince <= 5 ? '#047857'
                 : daysSince === 0 || daysSince === 1 ? '#d97706'
                 : T.muted,
            subColor: daysSince === null ? T.muted
                    : daysSince >= 2 && daysSince <= 5 ? '#047857'
                    : daysSince === 0 || daysSince === 1 ? '#d9770680'
                    : T.muted,
          },
          {
            lbl: 'Treino anterior',
            val: lastTitle || '—',
            sub: lastZone || '',
            good: null,
            color: lastZone ? zc : T.subtle,
            subColor: lastZone ? zc : T.muted,
          },
        ].map(({ lbl, val, sub, good, color, subColor }) => (
          <div key={lbl} style={{ background: T.card, borderRadius: 10, padding: '8px 10px' }}>
            <div style={{ fontFamily: T.mono, fontSize: 8, letterSpacing: '2px', textTransform: 'uppercase', color: T.muted, marginBottom: 3 }}>{lbl}</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
              <span style={{ fontFamily: T.mono, fontSize: 13, fontWeight: 700, color: color || (good === null ? T.text : good ? '#047857' : '#dc2626') }}>
                {val}
              </span>
              {good !== null && (
                <span style={{ fontSize: 10 }}>{good ? '↑' : '↓'}</span>
              )}
            </div>
            {sub && <div style={{ fontFamily: T.mono, fontSize: 8, color: subColor || T.dim, marginTop: 2 }}>{sub}</div>}
          </div>
        ))}
      </div>
    </div>
  );
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// PAGE: PROG
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function ProgPage({ profile, state, onSaveMetas }) {
  const ac = PROFILE_COLORS[profile];
  const hk = state.healthkit || [];
  const latest = hk[0] || null;
  const hist = state.hist || [];
  const wks = profile==='fk' ? FK_WK : JRV_WK;
  // Usa bodyComp (atalho iOS) como fonte primária; bioHistory (Drive) como fallback
  const bc = (state.bodyComp && state.bodyComp.length > 0)
    ? state.bodyComp
    : (state.bioHistory || []).map(r => {
        // Normaliza data DD/MM/YYYY → YYYY-MM-DD
        const raw = String(r.date || '');
        const date = /^\d{2}\/\d{2}\/\d{4}$/.test(raw)
          ? `${raw.slice(6)}-${raw.slice(3,5)}-${raw.slice(0,2)}`
          : raw.substring(0, 10);
        const bm = parseFloat(r.peso  || 0);
        const fp = parseFloat(r.gordura || 0);
        return {
          date,
          bodyMass:      bm,
          fatPercentage: fp,
          leanMass:      bm > 0 && fp > 0 ? parseFloat((bm * (1 - fp / 100)).toFixed(1)) : 0,
        };
      });
  const metas = state.metas;
  const hv = latest ? num(latest.hrv) : 0;

  const [metasForm, setMetasForm] = React.useState({peso:'',gordura:'',massaMagra:''});
  const [metasSaved, setMetasSaved] = React.useState(false);
  const [metasOpen, setMetasOpen] = React.useState(false);

  const handleSaveMetas = async () => {
    const {peso,gordura,massaMagra} = metasForm;
    if (!peso||!gordura||!massaMagra) { alert('Preencha os 3 campos'); return; }
    await onSaveMetas(profile, {
      peso:parseFloat(peso), gordura:parseFloat(gordura),
      massaMagra:parseFloat(massaMagra), visceral:0
    });
    setMetasSaved(true);
    setMetasOpen(false);
    setTimeout(() => setMetasSaved(false), 2500);
  };

  const recoveryScore = calcRecoveryScore(hk, hist);

  return (
    <div className="pb-safe" style={{padding:'16px 16px 0'}}>

      {/* ── RECOVERY SCORE ── */}
      {recoveryScore !== null && (
        <RecoveryScoreCard score={recoveryScore} healthkit={hk} hist={hist} ac={ac} />
      )}

      {/* ── APPLE HEALTH ── */}
      {(() => {
        let hkLabel = 'Hoje';
        if (latest && latest.date) {
          const d = new Date(String(latest.date).substring(0,10) + 'T12:00:00');
          const now = new Date();
          const diff = Math.round((new Date(now.getFullYear(),now.getMonth(),now.getDate()) - new Date(d.getFullYear(),d.getMonth(),d.getDate())) / 86400000);
          // syncedAt pode vir como "HH:MM" ou como ISO date (Sheets serializa time → 1899-12-30T...)
          const rawT = latest.syncedAt;
          let t = '—:—';
          if (rawT) {
            const s = String(rawT);
            if (s.includes('T')) {
              // ISO date: extrai HH:MM no fuso de SP
              try { t = new Date(s).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'}); } catch(e) {}
            } else {
              t = s.substring(0,5); // já é "HH:MM"
            }
          }
          if      (diff === 0) hkLabel = `Hoje · ${t}`;
          else if (diff === 1) hkLabel = `Ontem · ${t}`;
          else                 hkLabel = `${d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})} · ${t}`;
        }
        return <SLabel>Apple Health · {hkLabel}</SLabel>;
      })()}

      {latest ? (
        <>
          {/* 4 metric cards */}
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:10}}>
            {[
              {lbl:'HRV', val:fmtN(latest.hrv), unit:'ms', accent:true},
              {lbl:'FC Repouso', val:fmtN(latest.restingHR), unit:'bpm'},
              {lbl:'Cal Ativas', val:fmtN(latest.activeCalories), unit:'kcal'},
              {lbl:'Passos', val:fmtN(latest.steps), unit:''},
            ].map(({lbl,val,unit,accent}) => (
              <Card key={lbl} style={{padding:'12px 10px', textAlign:'center'}}>
                <div style={{fontFamily:T.mono, fontSize:10, letterSpacing:'2px', textTransform:'uppercase', color:T.dim, marginBottom:6}}>{lbl}</div>
                <div style={{fontFamily:T.mono, fontSize:28, fontWeight:700, lineHeight:1, color:accent?ac:T.text}}>
                  {val}
                  {unit && <span style={{fontSize:11, fontWeight:400, color:T.dim, marginLeft:2}}>{unit}</span>}
                </div>
              </Card>
            ))}
          </div>


          {/* 7-day trend table */}
          {hk.length > 1 && (() => {
            const rows = hk.slice(0,7);
            const hrvVals  = rows.map(h=>num(h.hrv)).filter(v=>v>0);
            const rhrVals  = rows.map(h=>num(h.restingHR)).filter(v=>v>0);
            const calVals  = rows.map(h=>num(h.activeCalories)).filter(v=>v>0);
            const avgHrv   = hrvVals.length  ? Math.round(hrvVals.reduce((a,b)=>a+b)/hrvVals.length)  : null;
            const avgRhr   = rhrVals.length  ? Math.round(rhrVals.reduce((a,b)=>a+b)/rhrVals.length)  : null;
            const avgCal   = calVals.length  ? Math.round(calVals.reduce((a,b)=>a+b)/calVals.length)  : null;
            // Tendência HRV: compara média dos últimos 3 vs anterior
            const hrvTrend = (() => {
              if (hrvVals.length < 4) return null;
              const recent = hrvVals.slice(0,3).reduce((a,b)=>a+b)/3;
              const older  = hrvVals.slice(3).reduce((a,b)=>a+b)/hrvVals.slice(3).length;
              return recent > older * 1.05 ? 'up' : recent < older * 0.95 ? 'down' : 'stable';
            })();
            const hkInsight = (() => {
              if (!avgHrv) return null;
              if (hrvTrend === 'up')     return `HRV em alta nos últimos 3 dias (+tendência positiva) — adaptação ao treino progredindo bem.`;
              if (hrvTrend === 'down')   return `HRV em queda — monitorar carga total de treino e qualidade do sono esta semana.`;
              if (avgCal && calVals[0] < avgCal * 0.5) return `Calorias hoje abaixo da média semanal — dados do dia ainda sendo registrados pelo Apple Watch.`;
              return `HRV estável na semana (média ${avgHrv} ms) — sistema nervoso autônomo bem adaptado.`;
            })();
            return (
              <Card style={{overflow:'hidden', marginBottom: hkInsight ? 8 : 20}}>
                <div style={{fontFamily:T.mono, fontSize:10, letterSpacing:'3px', textTransform:'uppercase', color:T.muted, padding:'10px 12px 6px'}}>
                  Últimos 7 dias
                </div>
                <div style={{display:'grid', gridTemplateColumns:'70px 1fr 1fr 1fr', padding:'6px 12px 8px', borderBottom:`1px solid ${T.border}`}}>
                  {['Data','HRV','FC','Cal'].map(h => (
                    <div key={h} style={{fontFamily:T.mono, fontSize:10, letterSpacing:'2px', textTransform:'uppercase', color:T.muted, textAlign:'center'}}>{h}</div>
                  ))}
                </div>
                {rows.map((h,i) => (
                  <div key={i} style={{
                    display:'grid', gridTemplateColumns:'70px 1fr 1fr 1fr',
                    padding:'7px 12px', borderBottom:`1px solid ${T.bg}`,
                    alignItems:'center'
                  }}>
                    <div style={{fontFamily:T.mono, fontSize:10, color:T.dim}}>{fmtD(h.date)}</div>
                    <div style={{fontFamily:T.mono, fontSize:10, fontWeight:600, color:ac, textAlign:'center'}}>{fmtN(h.hrv)}</div>
                    <div style={{fontFamily:T.mono, fontSize:10, color:T.subtle, textAlign:'center'}}>{fmtN(h.restingHR)}</div>
                    <div style={{fontFamily:T.mono, fontSize:10, color:T.subtle, textAlign:'center'}}>{fmtN(h.activeCalories)}</div>
                  </div>
                ))}
                {/* Linha de médias */}
                {avgHrv && (
                  <div style={{
                    display:'grid', gridTemplateColumns:'70px 1fr 1fr 1fr',
                    padding:'7px 12px', borderTop:`1px solid ${T.border}`,
                    background:'#ffffff06', alignItems:'center'
                  }}>
                    <div style={{fontFamily:T.mono, fontSize:9, letterSpacing:'1px', textTransform:'uppercase', color:T.muted}}>MÉDIA</div>
                    <div style={{fontFamily:T.mono, fontSize:10, fontWeight:700, color:ac, textAlign:'center'}}>{avgHrv}</div>
                    <div style={{fontFamily:T.mono, fontSize:10, fontWeight:700, color:T.subtle, textAlign:'center'}}>{avgRhr||'—'}</div>
                    <div style={{fontFamily:T.mono, fontSize:10, fontWeight:700, color:T.subtle, textAlign:'center'}}>{avgCal||'—'}</div>
                  </div>
                )}
              </Card>
            );
          })()}
          {/* Insight HealthKit */}
          {hk.length > 1 && (() => {
            const rows = hk.slice(0,7);
            const hrvVals = rows.map(h=>num(h.hrv)).filter(v=>v>0);
            const calVals = rows.map(h=>num(h.activeCalories)).filter(v=>v>0);
            const avgHrv  = hrvVals.length ? Math.round(hrvVals.reduce((a,b)=>a+b)/hrvVals.length) : null;
            const avgCal  = calVals.length ? Math.round(calVals.reduce((a,b)=>a+b)/calVals.length) : null;
            const hrvTrend = (() => {
              if (hrvVals.length < 4) return null;
              const recent = hrvVals.slice(0,3).reduce((a,b)=>a+b)/3;
              const older  = hrvVals.slice(3).reduce((a,b)=>a+b)/hrvVals.slice(3).length;
              return recent > older * 1.05 ? 'up' : recent < older * 0.95 ? 'down' : 'stable';
            })();
            let txt = null;
            if      (hrvTrend === 'up')   txt = `HRV em alta nos últimos 3 dias — adaptação ao treino progredindo. Sinal de supercompensação ativa.`;
            else if (hrvTrend === 'down') txt = `HRV em queda na semana — monitorar carga total e sono. Considere sessão de recuperação ativa.`;
            else if (avgHrv && calVals[0] && calVals[0] < avgCal * 0.5) txt = `Calorias hoje abaixo da média (${avgCal} kcal) — dados do dia ainda em andamento no Apple Watch.`;
            else if (avgHrv) txt = `HRV médio semanal: ${avgHrv} ms — variabilidade estável indica boa adaptação ao estímulo de treino.`;
            if (!txt) return null;
            return (
              <div style={{fontSize:11, color:T.dim, lineHeight:1.6, marginBottom:16, paddingLeft:2}}>
                {txt}
              </div>
            );
          })()}
        </>
      ) : (
        <Card style={{textAlign:'center', padding:'40px 20px', marginBottom:20}}>
          <div style={{fontSize:28, marginBottom:10}}>⌚</div>
          <div style={{fontFamily:T.mono, fontSize:10, letterSpacing:'2px', textTransform:'uppercase', color:T.muted}}>
            {profile==='jrv' ? 'Atalho J.R.V. em breve' : 'Dados aparecem após o primeiro check-in'}
          </div>
        </Card>
      )}

      {/* ── COMPOSIÇÃO CORPORAL ── */}
      <SLabel>Composição Corporal</SLabel>
      {bc.length > 0 ? (
        <>
          {/* Tabela de evolução: linhas = métricas, colunas = datas */}
          <Card style={{overflow:'hidden', marginBottom:12}}>
            {/* Header: datas */}
            <div style={{display:'grid', gridTemplateColumns:'72px repeat(3,1fr)', padding:'8px 12px 6px', borderBottom:`1px solid ${T.border}`}}>
              <div/>
              {bc.map((r,i) => (
                <div key={i} style={{fontFamily:T.mono, fontSize:10, letterSpacing:'1px', color: i===0 ? ac : T.muted, textAlign:'center', textTransform:'uppercase'}}>
                  {fmtD(r.date)}
                </div>
              ))}
              {[...Array(Math.max(0, 3 - bc.length))].map((_,i) => <div key={'eh'+i}/>)}
            </div>
            {/* Linhas: Peso, Gordura, Massa Magra */}
            {[
              {lbl:'PESO',   key:'bodyMass',       unit:'kg', goodDown:true},
              {lbl:'GORDURA',key:'fatPercentage',   unit:'%',  goodDown:true},
              {lbl:'LBM',    key:'leanMass',        unit:'kg', goodDown:false},
            ].map(({lbl,key,unit,goodDown},ri) => {
              const vals = bc.map(r => parseFloat(String(r[key]||'0').replace(',','.')));
              const first = vals[0]||0;
              const last  = vals[vals.length-1]||0;
              const trend = vals.length >= 2 && last > 0 ? first - last : null;
              const trendGood = trend !== null ? (goodDown ? trend <= 0 : trend >= 0) : null;
              return (
                <div key={lbl} style={{
                  display:'grid', gridTemplateColumns:'72px repeat(3,1fr)',
                  padding:'9px 12px', borderBottom: ri < 2 ? `1px solid ${T.border}` : 'none',
                  alignItems:'center'
                }}>
                  <div style={{display:'flex', flexDirection:'column', gap:2}}>
                    <span style={{fontFamily:T.mono, fontSize:10, letterSpacing:'2px', textTransform:'uppercase', color:T.dim}}>{lbl}</span>
                    {trend !== null && (
                      <span style={{fontFamily:T.mono, fontSize:10, color: trendGood ? '#047857' : '#dc2626'}}>
                        {trend > 0 ? '↑' : '↓'} {Math.abs(trend).toFixed(1)}{unit}
                      </span>
                    )}
                  </div>
                  {vals.map((v,i) => (
                    <div key={i} style={{textAlign:'center'}}>
                      <span style={{fontFamily:T.mono, fontSize: i===0?14:11, fontWeight: i===0?700:400, color: i===0?T.text:T.dim}}>
                        {v > 0 ? v.toFixed(1) : '—'}
                      </span>
                      {v > 0 && <span style={{fontFamily:T.mono, fontSize:10, color:T.muted, marginLeft:1}}>{unit}</span>}
                    </div>
                  ))}
                  {[...Array(Math.max(0, 3 - vals.length))].map((_,i) => <div key={'ev'+i}/>)}
                </div>
              );
            })}
          </Card>

          {/* Narrativa interpretativa — dois blocos */}
          {bc.length >= 2 && (() => {
            const p0  = parseFloat(bc[0].bodyMass||0),      pN = parseFloat(bc[bc.length-1].bodyMass||0);
            const g0  = parseFloat(bc[0].fatPercentage||0), gN = parseFloat(bc[bc.length-1].fatPercentage||0);
            const m0  = parseFloat(bc[0].leanMass||0),      mN = parseFloat(bc[bc.length-1].leanMass||0);
            const dP  = p0 - pN, dG = g0 - gN, dM = m0 - mN;

            // — BLOCO 1: ANÁLISE (trajetória) —
            let analysisLine = '';
            if (dP > 0 && dM > 0 && dG > 0) {
              const ratio = dM / dP;
              if (ratio >= 0.5) analysisLine = `Ganho de ${dP.toFixed(1)}kg com ${(ratio*100).toFixed(0)}% em massa magra — rácio adequado para fase de construção (referência: >50%).`;
              else              analysisLine = `Ganho de ${dP.toFixed(1)}kg com ${(ratio*100).toFixed(0)}% em massa magra — proporção de gordura acima do ideal para a fase atual. Considere ajustar o superávit calórico.`;
            } else if (dP > 0 && dM > 0 && dG <= 0) {
              analysisLine = `Recomposição corporal confirmada: massa magra ↑${dM.toFixed(1)}kg e gordura ↓${Math.abs(dG).toFixed(1)}% no período. Resposta positiva ao protocolo.`;
            } else if (dP <= 0 && dM >= 0) {
              analysisLine = `Redução de gordura com preservação de massa magra — déficit bem calibrado.`;
            } else if (dP < 0 && dM < 0) {
              analysisLine = `Perda de peso com redução de massa magra — avalie ingestão proteica e volume de treino.`;
            }

            // — BLOCO 2: EM RELAÇÃO ÀS METAS —
            let metaLine = '';
            let metaRec  = '';
            if (metas) {
              const distM = num(metas.massaMagra) - m0;
              const distG = g0 - num(metas.gordura);
              const distP = p0 - num(metas.peso);
              if (distM > 0.5 && distG > 1) {
                metaLine = `Faltam ${distM.toFixed(1)}kg de massa magra e ${distG.toFixed(1)}pp de gordura para atingir as metas.`;
                metaRec  = `Priorize progressão de cargas e déficit moderado (~200–300 kcal).`;
              } else if (distM > 0.5) {
                metaLine = `A ${distM.toFixed(1)}kg da meta de massa magra (${num(metas.massaMagra)}kg). Gordura dentro do alvo.`;
                metaRec  = `Foco em progressão de cargas e ingestão proteica ≥1.8g/kg.`;
              } else if (distG > 1) {
                metaLine = `Massa magra próxima da meta. Gordura ${distG.toFixed(1)}pp acima do alvo (${num(metas.gordura)}%).`;
                metaRec  = `Mantenha déficit moderado sem comprometer volume de treino.`;
              } else {
                metaLine = `Métricas dentro da janela das metas.`;
                metaRec  = `Fase de ajuste fino — manutenção e monitoramento quinzenal.`;
              }
            }

            const blockStyle = {
              borderRadius: 8,
              padding: '10px 12px',
              marginBottom: 8,
              borderLeft: `2px solid`,
            };
            const labelStyle = {
              fontFamily: T.mono,
              fontSize: 9,
              letterSpacing: '1.5px',
              textTransform: 'uppercase',
              marginBottom: 5,
            };

            return (
              <div style={{marginBottom: 12}}>
                {analysisLine && (
                  <div style={{...blockStyle, background:'#ffffff05', borderColor: T.border}}>
                    <div style={{...labelStyle, color: T.muted}}>Análise</div>
                    <div style={{fontSize:11, color:T.dim, lineHeight:1.7}}>{analysisLine}</div>
                    <div style={{fontSize:10, color:T.muted, marginTop:5, lineHeight:1.5}}>
                      Leitura baseada em bioimpedância — variações de hidratação podem influenciar os valores.
                    </div>
                  </div>
                )}
                {metaLine && (
                  <div style={{...blockStyle, background:'#ffffff07', borderColor: ac + '55'}}>
                    <div style={{...labelStyle, color: ac}}>Em relação às metas</div>
                    <div style={{fontSize:11, color:T.dim, lineHeight:1.7}}>{metaLine}</div>
                    {metaRec && <div style={{fontSize:11, color:T.subtle, lineHeight:1.7, marginTop:3}}>{metaRec}</div>}
                  </div>
                )}
              </div>
            );
          })()}

          {/* Deltas em relação à meta */}
          {metas && (
            <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:8, marginBottom:8}}>
              {[
                {lbl:'Meta Peso',  cur:parseFloat(String(bc[0].bodyMass||'0')),       meta:num(metas.peso),       unit:'kg', goodDown:true},
                {lbl:'Meta Gord.', cur:parseFloat(String(bc[0].fatPercentage||'0')),  meta:num(metas.gordura),    unit:'%',  goodDown:true},
                {lbl:'Meta LBM',   cur:parseFloat(String(bc[0].leanMass||'0')),       meta:num(metas.massaMagra), unit:'kg', goodDown:false},
              ].map(({lbl,cur,meta,unit,goodDown}) => {
                if (!meta || !cur) return null;
                const diff = cur - meta;
                const arrived = Math.abs(diff) < 0.2;
                const good = arrived || (goodDown ? diff <= 0 : diff >= 0);
                return (
                  <Card key={lbl} style={{padding:'10px 8px', textAlign:'center'}}>
                    <div style={{fontFamily:T.mono, fontSize:10, letterSpacing:'1px', textTransform:'uppercase', color:T.dim, marginBottom:4}}>{lbl}</div>
                    <div style={{fontFamily:T.mono, fontSize:12, fontWeight:700, color: arrived ? '#047857' : good ? '#047857' : '#dc2626'}}>
                      {arrived ? '✓' : `${diff > 0 ? '+' : ''}${diff.toFixed(1)}${unit}`}
                    </div>
                    <div style={{fontFamily:T.mono, fontSize:10, color:T.dim, marginTop:1}}>{meta}{unit}</div>
                  </Card>
                );
              })}
            </div>
          )}
        </>
      ) : (
        <Card style={{textAlign:'center', padding:'28px 20px', marginBottom:4}}>
          <div style={{fontFamily:T.mono, fontSize:10, letterSpacing:'2px', textTransform:'uppercase', color:T.muted}}>
            {'Execute o atalho "Carlota Body Sync" para sincronizar'}
          </div>
        </Card>
      )}

      {/* ── METAS ── */}
      <div style={{marginBottom:20}}>
        <button
          onClick={() => setMetasOpen(o => !o)}
          style={{
            display:'flex', alignItems:'center', gap:6, background:'transparent',
            border:'none', cursor:'pointer', padding:'8px 0', width:'100%'
          }}
        >
          <span style={{fontFamily:T.mono, fontSize:10, letterSpacing:'3px', textTransform:'uppercase', color: metasSaved ? '#047857' : T.muted}}>
            {metasSaved ? '✓ METAS SALVAS' : '◎ DEFINIR METAS'}
          </span>
          <span style={{fontFamily:T.mono, fontSize:10, color:T.border2}}>{metasOpen ? '▲' : '▼'}</span>
        </button>
        {metasOpen && (
          <div style={{background:T.surface, border:`1px solid ${T.border}`, borderRadius:12, padding:'14px 16px'}}>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8, marginBottom:10}}>
              {[
                {lbl:'Peso (kg)',     key:'peso'},
                {lbl:'Gordura (%)',   key:'gordura'},
                {lbl:'M.Magra (kg)',  key:'massaMagra'},
              ].map(({lbl,key}) => (
                <div key={key}>
                  <div style={{fontFamily:T.mono, fontSize:10, letterSpacing:'2px', textTransform:'uppercase', color:T.muted, marginBottom:5}}>{lbl}</div>
                  <input
                    type="number" step="0.1"
                    placeholder={metas ? String(metas[key]||'') : '—'}
                    value={metasForm[key]}
                    onChange={e => setMetasForm({...metasForm,[key]:e.target.value})}
                    style={{
                      width:'100%', textAlign:'center', fontFamily:T.mono, fontSize:15, fontWeight:700,
                      padding:'9px 4px', borderRadius:8, outline:'none',
                      background:T.card, border:`1.5px solid ${metasForm[key]?`${ac}60`:T.border}`,
                      color:T.text, transition:'border-color .2s', boxSizing:'border-box'
                    }}
                  />
                </div>
              ))}
            </div>
            <button onClick={handleSaveMetas} style={{
              width:'100%', padding:'11px', borderRadius:10, border:'none', cursor:'pointer',
              fontFamily:T.mono, fontSize:10, fontWeight:700, letterSpacing:'2px', textTransform:'uppercase',
              background:ac, color:'#fff'
            }}>
              SALVAR METAS
            </button>
          </div>
        )}
      </div>

      {/* ── WORKOUT EVOLUTION ── */}
      <SLabel>Evolução por treino</SLabel>

      {hist.length === 0 ? (
        <Card style={{textAlign:'center', padding:'32px 20px', marginBottom:20}}>
          <div style={{fontFamily:T.mono, fontSize:9, letterSpacing:'2px', textTransform:'uppercase', color:T.muted}}>
            Evolução aparece após os primeiros treinos
          </div>
        </Card>
      ) : (
        wks.map(wk => {
          const sessions = hist.filter(h => h.wkId === wk.id).slice(0,3);
          if (!sessions.length) return null;
          const exMap = {};
          // Sessões mais recentes primeiro → inverter para construir em ordem cronológica
          sessions.slice().reverse().forEach(sess => {
            const dateStr = new Date(sess.date).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
            (sess.exercises||[]).forEach(ex => {
              const key = ex.name; // agrupa por nome — evita cruzar exercícios renomeados entre sessões
              if (!exMap[key]) exMap[key] = {name:ex.name, pts:[]};
              const maxKg = Math.max(...(ex.sets||[]).map(s=>num(s.kg)).filter(v=>v>0));
              exMap[key].pts.push({date:dateStr, kg:maxKg>0?maxKg:null});
            });
          });
          const zc = ZONE_COLORS[wk.zone] || ac;
          return (
            <div key={wk.id} style={{
              background:T.surface, border:`1px solid ${T.border}`,
              borderLeft:`2px solid ${zc}`, borderRadius:'0 10px 10px 0',
              padding:'10px 12px', marginBottom:8
            }}>
              <div style={{fontFamily:T.mono, fontSize:11, fontWeight:700, letterSpacing:'2px', color:zc, marginBottom:8, display:'flex', alignItems:'center', gap:8}}>
                {wk.title}
                <span style={{fontFamily:T.mono, fontSize:8, letterSpacing:'1px', color:T.muted, fontWeight:400}}>{wk.zone}</span>
              </div>
              {Object.values(exMap).map((ex,i) => (
                <div key={i} style={{paddingBottom:6, marginBottom:6, borderBottom:`1px solid ${T.border}`}}>
                  <div style={{fontSize:10, fontWeight:600, color:T.subtle, marginBottom:4}}>{ex.name}</div>
                  <div style={{display:'flex', alignItems:'center', gap:4, flexWrap:'wrap'}}>
                    {ex.pts.map((pt,j) => (
                      <React.Fragment key={j}>
                        <div style={{display:'flex', flexDirection:'column', alignItems:'center'}}>
                          <span style={{fontFamily:T.mono, fontSize:7, color:T.muted}}>{pt.date}</span>
                          <span style={{fontFamily:T.mono, fontSize:10, fontWeight:j===ex.pts.length-1?700:400, color:j===ex.pts.length-1?ac:T.dim}}>
                            {pt.kg!=null ? `${pt.kg}kg` : '—'}
                          </span>
                        </div>
                        {j < ex.pts.length-1 && <span style={{fontSize:9, color:T.border2}}>→</span>}
                      </React.Fragment>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          );
        })
      )}
      <div style={{height:16}}/>
    </div>
  );
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// PAGE: TREINO
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// EXERCISE LIBRARY — biblioteca de nomes canônicos de exercícios
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const EX_LIB_KEY = 'carlota_ex_lib';
const PT_SKIP    = new Set(['com','de','do','da','dos','das','em','e','a','o','os','as','por','para','no','na','nos','nas','ao','aos']);

function normalizeExName(raw) {
  return raw.trim().replace(/\s+/g,' ')
    .split(' ')
    .map((w,i) => (i===0 || !PT_SKIP.has(w.toLowerCase()))
      ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()
      : w.toLowerCase())
    .join(' ');
}

function getExLib() {
  try {
    const raw = localStorage.getItem(EX_LIB_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  // Pré-popula com todos os exercícios do FK_WK
  const names = new Set();
  FK_WK.forEach(wk => wk.ex.forEach(ex => names.add(ex.name)));
  const lib = [...names].sort((a,b) => a.localeCompare(b,'pt-BR'));
  try { localStorage.setItem(EX_LIB_KEY, JSON.stringify(lib)); } catch(e) {}
  return lib;
}

function saveToExLib(name) {
  const lib  = getExLib();
  const norm = normalizeExName(name);
  if (!lib.some(n => n.toLowerCase() === norm.toLowerCase())) {
    lib.push(norm);
    lib.sort((a,b) => a.localeCompare(b,'pt-BR'));
    try { localStorage.setItem(EX_LIB_KEY, JSON.stringify(lib)); } catch(e) {}
  }
  return norm;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// EXERCISE SEARCH MODAL — bottom sheet com busca na biblioteca
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function ExerciseSearchModal({ onSelect, onClose }) {
  const [query, setQuery] = React.useState('');
  const lib = React.useMemo(() => getExLib(), []);

  const filtered = query.length < 1
    ? lib
    : lib.filter(n => n.toLowerCase().includes(query.toLowerCase()));

  const trimmed  = query.trim();
  const canAdd   = trimmed.length > 2 &&
                   !lib.some(n => n.toLowerCase() === trimmed.toLowerCase());

  const handleSelect = (name) => { saveToExLib(name); onSelect(name); };
  const handleAddNew = () => { onSelect(saveToExLib(trimmed)); };

  return (
    <div style={{position:'fixed',inset:0,zIndex:999,background:'rgba(0,0,0,.8)',display:'flex',flexDirection:'column'}}
         onClick={e => { if(e.target===e.currentTarget) onClose(); }}>
      <div style={{
        background:T.surface, borderRadius:'20px 20px 0 0',
        marginTop:'auto', maxHeight:'78vh', display:'flex', flexDirection:'column',
        border:`1px solid ${T.border}`, borderBottom:'none'
      }}>
        {/* Header */}
        <div style={{padding:'16px 16px 12px',display:'flex',alignItems:'center',gap:10,borderBottom:`1px solid ${T.border}`}}>
          <input
            autoFocus
            value={query}
            onChange={e => setQuery(e.target.value)}
            placeholder="Buscar exercício..."
            style={{
              flex:1, background:T.card, border:`1px solid ${T.border}`,
              borderRadius:10, padding:'10px 14px', fontFamily:'Geist,sans-serif',
              fontSize:14, color:T.text, outline:'none'
            }}
          />
          <button onClick={onClose} style={{
            background:'transparent',border:'none',color:T.muted,
            fontFamily:T.mono,fontSize:12,cursor:'pointer',padding:'8px',flexShrink:0
          }}>✕</button>
        </div>
        {/* List */}
        <div style={{overflowY:'auto',flex:1}}>
          {canAdd && (
            <button onClick={handleAddNew} style={{
              width:'100%',textAlign:'left',padding:'14px 16px',
              background:'transparent',border:'none',borderBottom:`1px solid ${T.border}`,
              cursor:'pointer',fontFamily:'Geist,sans-serif',fontSize:13,
              color:'#a3e635',display:'flex',alignItems:'center',gap:10
            }}>
              <span style={{
                fontFamily:T.mono,fontSize:9,background:'#a3e63520',
                padding:'2px 8px',borderRadius:4,border:'1px solid #a3e63540',flexShrink:0
              }}>+ NOVO</span>
              {normalizeExName(trimmed)}
            </button>
          )}
          {filtered.map(name => (
            <button key={name} onClick={() => handleSelect(name)} style={{
              width:'100%',textAlign:'left',padding:'14px 16px',
              background:'transparent',border:'none',borderBottom:`1px solid ${T.border}`,
              cursor:'pointer',fontFamily:'Geist,sans-serif',fontSize:13,color:T.text
            }}>
              {name}
            </button>
          ))}
          {filtered.length === 0 && !canAdd && (
            <div style={{padding:'32px 16px',textAlign:'center',fontFamily:T.mono,fontSize:11,color:T.muted}}>
              Nenhum exercício encontrado
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CUSTOM EX CARD — exercício com sets dinâmicos (add/remove por série)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function CustomExCard({ exIdx, name, sets, obs, onUpdate, onRemove, isOpen, onToggle, ac, lastRef }) {
  const done = sets.filter(s => s.done).length;

  const updateSet = (i, field, val) =>
    onUpdate(sets.map((s,si) => si===i ? {...s,[field]:val} : s), obs);

  const toggleDone = (i) => {
    const next = sets.map((s, si) => {
      if (si !== i) return s;
      if (!s.done) {
        const phKg   = String(lastRef?.sets?.find(ls => ls.s === i+1)?.kg   || '');
        const phReps = String(lastRef?.sets?.find(ls => ls.s === i+1)?.reps || '');
        return { ...s, done: true, kg: s.kg || phKg, reps: s.reps || phReps };
      }
      return { ...s, done: false };
    });
    onUpdate(next, obs);
  };

  const addSet = () => {
    const last = sets[sets.length-1] || {};
    onUpdate([...sets, {kg: last.kg||'', reps: last.reps||'', done:false}], obs);
  };

  const removeSet = (i) => {
    if (sets.length <= 1) return;
    onUpdate(sets.filter((_,si) => si!==i), obs);
  };

  return (
    <div style={{
      background:T.surface, borderRadius:'0 12px 12px 0',
      border:`1px solid ${T.border}`, borderLeft:`2px solid ${ac}`,
      marginBottom:8, overflow:'hidden'
    }}>
      <button onClick={onToggle} style={{
        width:'100%',textAlign:'left',background:'transparent',
        border:'none',cursor:'pointer',padding:'12px 14px 10px'
      }}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontFamily:T.mono,fontSize:10,letterSpacing:'2px',color:T.muted,textTransform:'uppercase',marginBottom:3}}>
              EX {String(exIdx+1).padStart(2,'0')}
              {done > 0 && <span style={{color:ac,marginLeft:6}}>{done===sets.length?'✓':`${done}/${sets.length}`}</span>}
            </div>
            <div style={{fontSize:13,fontWeight:600,color:T.text,lineHeight:1.35}}>{name}</div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <button
              onClick={e=>{e.stopPropagation();onRemove();}}
              style={{
                background:'transparent',border:`1px solid ${T.border}`,borderRadius:6,
                color:T.muted,fontSize:11,cursor:'pointer',padding:'3px 8px',fontFamily:T.mono
              }}
            >✕</button>
            <div style={{fontFamily:T.mono,fontSize:10,color:T.muted,flexShrink:0}}>{isOpen?'▲':'▼'}</div>
          </div>
        </div>
      </button>

      {isOpen && (
        <div className="anim-fadein" style={{
          borderTop:`1px solid ${T.border}`,background:T.bg,padding:'12px 14px 14px'
        }}>
          {/* Referência da última vez */}
          {lastRef && (
            <div style={{
              padding:'8px 10px',borderRadius:8,marginBottom:10,
              background:'#d9770608',border:'1px solid #d9770620'
            }}>
              <div style={{fontFamily:T.mono,fontSize:10,letterSpacing:'2px',color:'#a16207',textTransform:'uppercase',marginBottom:3}}>
                🕐 última vez · {fmtDate(lastRef.date)}
              </div>
              <div style={{fontFamily:T.mono,fontSize:10,color:'#78450c',lineHeight:1.6}}>
                {lastRef.sets?.map(s=>`S${s.s}:${s.kg||'?'}kg×${s.reps||'?'}`).join(' · ')}
              </div>
            </div>
          )}
          {/* Column headers */}
          <div style={{display:'grid',gridTemplateColumns:'22px 1fr 1fr 38px 30px',gap:6,marginBottom:6}}>
            {['','KG','REPS','',''].map((h,i)=>(
              <div key={i} style={{fontFamily:T.mono,fontSize:10,letterSpacing:'2px',color:T.muted,textAlign:'center',textTransform:'uppercase'}}>{h}</div>
            ))}
          </div>

          {sets.map((s,i) => (
            <div key={i} style={{display:'grid',gridTemplateColumns:'22px 1fr 1fr 38px 30px',gap:6,marginBottom:6,alignItems:'center'}}>
              <div style={{fontFamily:T.mono,fontSize:13,fontWeight:700,textAlign:'center',color:s.done?ac:T.muted}}>{i+1}</div>
              <input
                type="number" inputMode="decimal"
                placeholder={lastRef?.sets?.find(ls => ls.s === i+1)?.kg || '—'}
                value={s.kg} onChange={e=>updateSet(i,'kg',e.target.value)}
                style={{
                  background:T.card,border:`1.5px solid ${s.done?`${ac}40`:T.border}`,
                  borderRadius:8,padding:'10px 4px',fontFamily:T.mono,
                  fontSize:15,fontWeight:600,color:s.done?T.dim:T.text,
                  textAlign:'center',outline:'none',width:'100%',
                  opacity:s.done?0.4:1,transition:'all .15s'
                }}
              />
              <input
                type="number" inputMode="numeric"
                placeholder={lastRef?.sets?.find(ls => ls.s === i+1)?.reps || '—'}
                value={s.reps} onChange={e=>updateSet(i,'reps',e.target.value)}
                style={{
                  background:T.card,border:`1.5px solid ${s.done?`${ac}40`:T.border}`,
                  borderRadius:8,padding:'10px 4px',fontFamily:T.mono,
                  fontSize:15,fontWeight:600,color:s.done?T.dim:T.text,
                  textAlign:'center',outline:'none',width:'100%',
                  opacity:s.done?0.4:1,transition:'all .15s'
                }}
              />
              <button onClick={()=>toggleDone(i)} style={{
                width:38,height:40,borderRadius:8,border:`1.5px solid ${s.done?ac:T.border}`,
                background:s.done?ac:T.card,color:s.done?'#fff':T.muted,
                fontSize:14,fontWeight:700,cursor:'pointer',transition:'all .15s',
                display:'flex',alignItems:'center',justifyContent:'center'
              }}>{s.done?'✓':'○'}</button>
              <button onClick={()=>removeSet(i)} style={{
                width:30,height:40,borderRadius:8,border:`1px solid ${T.border}`,
                background:'transparent',color:T.muted,fontSize:18,cursor:sets.length<=1?'not-allowed':'pointer',
                display:'flex',alignItems:'center',justifyContent:'center',
                opacity:sets.length<=1?0.3:1
              }}>−</button>
            </div>
          ))}

          <button onClick={addSet} style={{
            width:'100%',marginTop:4,padding:'8px',
            background:'transparent',border:`1px dashed ${ac}40`,
            borderRadius:8,fontFamily:T.mono,fontSize:9,
            letterSpacing:'1px',textTransform:'uppercase',color:ac,cursor:'pointer'
          }}>+ SÉRIE</button>

          <textarea
            value={obs}
            onChange={e=>onUpdate(sets,e.target.value)}
            placeholder="Observações..."
            rows={2}
            style={{
              width:'100%',marginTop:8,padding:'8px 10px',
              background:T.card,border:`1px solid ${T.border}`,
              borderRadius:8,fontFamily:'Geist,sans-serif',fontSize:11,
              color:T.subtle,resize:'none',outline:'none',lineHeight:1.5
            }}
          />
        </div>
      )}
    </div>
  );
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CUSTOM WORKOUT BUILDER — montagem do treino personalizado do dia
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function CustomWorkoutBuilder({ profile, state, onSaveCustom, savingWk, ac }) {
  const STORAGE_KEY  = `cw_${profile}_CUSTOM`;
  const OTHER        = profile === 'fk' ? 'jrv' : 'fk';
  const OTHER_KEY    = `cw_${OTHER}_CUSTOM`;
  const ZONE_OPTIONS = ['FORÇA','HIPERTROFIA','METABÓLICO'];
  const ZONE_INFO    = {
    'FORÇA':       { reps:'4–6 reps', rest:'2–3 min descanso' },
    'HIPERTROFIA': { reps:'8–12 reps', rest:'60–90 seg descanso' },
    'METABÓLICO':  { reps:'15–20 reps', rest:'30–45 seg descanso' },
  };

  // Carrega do localStorage — suporta formato array (legado) e objeto {exercises, sharedBy}
  const loadStored = () => {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      if (Array.isArray(raw)) return { exercises: raw, sharedBy: null };
      // Se veio de outro perfil, limpa cargas/reps/obs ao carregar (cada um preenche o seu)
      if (raw.sharedBy && raw.sharedBy !== profile) {
        return {
          ...raw,
          exercises: (raw.exercises || []).map(ex => ({
            ...ex,
            sets: (ex.sets || []).map(() => ({kg:'', reps:'', done:false})),
            obs: ''
          }))
        };
      }
      return raw;
    } catch(e) { return { exercises: [], sharedBy: null }; }
  };

  const stored = loadStored();
  const [exercises,  setExercises]  = React.useState(stored.exercises || []);
  const [sharedBy,   setSharedBy]   = React.useState(stored.sharedBy  || null);
  const [zone,       setZone]       = React.useState('HIPERTROFIA');
  const SHARED_KEY = 'carlota_custom_shared';
  const [shared, setShared] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem(SHARED_KEY) || 'false'); } catch(e) { return false; }
  });
  const [showSearch, setShowSearch] = React.useState(false);
  const OPEN_IDX_KEY = 'carlota_custom_openIdx';
  const [openExIdx, setOpenExIdx] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem(OPEN_IDX_KEY) || 'null'); } catch(e) { return null; }
  });
  const toggleOpen = (i) => {
    const next = openExIdx === i ? null : i;
    setOpenExIdx(next);
    try { localStorage.setItem(OPEN_IDX_KEY, JSON.stringify(next)); } catch(e) {}
  };

  const isSaving = savingWk === `${profile}-CUSTOM`;
  const zoneInfo = ZONE_INFO[zone];

  // Persiste no perfil atual; syncOther=true apenas quando a lista muda (add/remove/toggle)
  // Nunca sincronizar ao atualizar kg/reps — cada perfil preenche o seu
  const persist = (exs, isShared, syncOther = false) => {
    setExercises(exs);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(exs)); } catch(e) {}
    if (syncOther && (isShared !== undefined ? isShared : shared)) {
      try {
        // Compartilha só a estrutura — sem cargas/reps/obs do perfil atual
        const sharedExs = exs.map(ex => ({
          ...ex,
          sets: ex.sets.map(() => ({kg:'', reps:'', done:false})),
          obs: ''
        }));
        localStorage.setItem(OTHER_KEY, JSON.stringify({
          exercises: sharedExs,
          sharedBy:  profile,
          sharedAt:  new Date().toLocaleString('pt-BR', {timeZone:'America/Sao_Paulo'})
        }));
      } catch(e) {}
    }
  };

  // Ao ligar compartilhado, espelha imediatamente os exercícios existentes
  const toggleShared = () => {
    const next = !shared;
    setShared(next);
    try { localStorage.setItem(SHARED_KEY, JSON.stringify(next)); } catch(e) {}
    if (next && exercises.length > 0) persist(exercises, true, true);
  };

  const addExercise = (name) => {
    const newEx = {
      name,
      sets: [{kg:'',reps:'',done:false},{kg:'',reps:'',done:false},{kg:'',reps:'',done:false}],
      obs: ''
    };
    const next = [...exercises, newEx];
    persist(next, undefined, true);
    const newIdx = next.length - 1;
    setOpenExIdx(newIdx);
    try { localStorage.setItem(OPEN_IDX_KEY, JSON.stringify(newIdx)); } catch(e) {}
    setShowSearch(false);
  };

  const updateExercise = (i, sets, obs) =>
    persist(exercises.map((ex,ei) => ei===i ? {...ex,sets,obs} : ex));

  const removeExercise = (i) => {
    persist(exercises.filter((_,ei) => ei!==i), undefined, true);
    setOpenExIdx(idx => {
      const next = idx===i ? null : idx>i ? idx-1 : idx;
      try { localStorage.setItem(OPEN_IDX_KEY, JSON.stringify(next)); } catch(e) {}
      return next;
    });
  };

  const handleSave = () => {
    onSaveCustom(profile, exercises, zone);
    // Reseta toggle e card aberto ao salvar — próxima sessão começa limpa
    try {
      localStorage.removeItem(SHARED_KEY);
      localStorage.removeItem(OPEN_IDX_KEY);
    } catch(e) {}
  };

  // Busca última referência de um exercício pelo nome no histórico
  const getLastRef = (name) => {
    const hist = state?.hist || [];
    for (const entry of hist) {
      const found = (entry.exercises||[]).find(e => e.name === name);
      if (found) return { date: entry.date, sets: found.sets };
    }
    return null;
  };

  return (
    <div className="pb-safe">
      <div style={{padding:'16px 16px 0'}}>
        {/* Header */}
        <div style={{marginBottom:20}}>
          <div style={{fontFamily:T.mono,fontSize:38,fontWeight:900,letterSpacing:'4px',lineHeight:1,color:T.text,marginBottom:4}}>
            CUSTOM
          </div>
          <div style={{fontSize:12,color:T.dim,marginBottom:14}}>Treino personalizado do dia</div>

          {/* Zone selector — mesmo estilo do badge de zona dos treinos programados */}
          <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
            {ZONE_OPTIONS.map(z => (
              <button key={z} onClick={() => setZone(z)} style={{
                padding:'5px 12px',borderRadius:4,fontFamily:T.mono,
                fontSize:9,letterSpacing:'2px',textTransform:'uppercase',
                cursor:'pointer',transition:'all .15s',
                background: zone===z ? `${ZONE_COLORS[z]}18` : 'transparent',
                color:       zone===z ? ZONE_COLORS[z] : T.muted,
                border:      `1px solid ${zone===z ? ZONE_COLORS[z]+'30' : T.border}`
              }}>{z}</button>
            ))}
          </div>

          {/* Zone info — mesmo padrão visual dos stats grid dos treinos programados */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:14}}>
            {[['Reps', zoneInfo.reps],['Descanso', zoneInfo.rest]].map(([lbl,val]) => (
              <div key={lbl} style={{
                background:T.surface,border:`1px solid ${T.border}`,
                borderRadius:10,padding:'10px 6px',textAlign:'center'
              }}>
                <div style={{fontFamily:T.mono,fontSize:13,fontWeight:700,color:ZONE_COLORS[zone],lineHeight:1.2}}>{val}</div>
                <div style={{fontFamily:T.mono,fontSize:8,letterSpacing:'2px',textTransform:'uppercase',color:T.muted,marginTop:3}}>{lbl}</div>
              </div>
            ))}
          </div>

          {/* Aviso de treino compartilhado recebido */}
          {sharedBy && (
            <div style={{
              padding:'10px 12px',borderRadius:'0 10px 10px 0',marginBottom:14,
              background:`${ac}0d`,border:`1px solid ${T.border}`,borderLeftWidth:2,borderLeftColor:ac,
              display:'flex',alignItems:'center',gap:8
            }}>
              <span style={{fontSize:12}}>🔗</span>
              <div style={{fontFamily:T.mono,fontSize:9,color:ac,letterSpacing:'1px'}}>
                Exercícios de {sharedBy.toUpperCase()} · Preencha sua própria carga
              </div>
            </div>
          )}

          {/* Toggle compartilhado */}
          <button onClick={toggleShared} style={{
            display:'flex',alignItems:'center',gap:10,
            background:'transparent',border:`1px solid ${shared?ac+'40':T.border}`,
            borderRadius:10,padding:'10px 14px',cursor:'pointer',width:'100%'
          }}>
            <div style={{
              width:32,height:18,borderRadius:9,transition:'all .2s',position:'relative',
              background:shared?ac:T.border2,flexShrink:0
            }}>
              <div style={{
                position:'absolute',top:2,left:shared?14:2,
                width:14,height:14,borderRadius:7,background:'#FFFFFF',transition:'all .2s'
              }}/>
            </div>
            <div style={{textAlign:'left'}}>
              <div style={{fontFamily:T.mono,fontSize:9,letterSpacing:'1px',textTransform:'uppercase',color:shared?ac:T.muted}}>
                {shared ? 'Compartilhado com '+OTHER.toUpperCase() : 'Só para mim'}
              </div>
              {shared && (
                <div style={{fontFamily:T.mono,fontSize:8,color:T.muted,marginTop:2}}>
                  {OTHER.toUpperCase()} verá os exercícios e preencherá a própria carga
                </div>
              )}
            </div>
          </button>
        </div>

        {/* Exercise list */}
        {exercises.length > 0 && (
          <>
            <SLabel>Exercícios · toque para registrar</SLabel>
            {exercises.map((ex,i) => (
              <CustomExCard
                key={i}
                exIdx={i}
                name={ex.name}
                sets={ex.sets}
                obs={ex.obs}
                ac={ac}
                lastRef={getLastRef(ex.name)}
                isOpen={openExIdx===i}
                onToggle={() => toggleOpen(i)}
                onUpdate={(sets,obs) => updateExercise(i,sets,obs)}
                onRemove={() => removeExercise(i)}
              />
            ))}
          </>
        )}

        {exercises.length === 0 && (
          <div style={{
            textAlign:'center',padding:'40px 0 28px',
            color:T.muted,fontFamily:T.mono,fontSize:11,lineHeight:1.8
          }}>
            Nenhum exercício adicionado<br/>
            <span style={{color:T.border}}>Toque em "+ Adicionar Exercício" para começar</span>
          </div>
        )}

        {/* Add exercise */}
        <button onClick={() => setShowSearch(true)} style={{
          width:'100%',marginBottom:16,padding:'14px',borderRadius:12,
          border:`1px dashed ${ac}50`,background:'transparent',
          fontFamily:T.mono,fontSize:10,letterSpacing:'2px',textTransform:'uppercase',
          color:ac,cursor:'pointer'
        }}>+ Adicionar Exercício</button>

        {/* Save button */}
        {exercises.length > 0 && (
          <div style={{marginBottom:24}}>
            <button
              onClick={handleSave}
              disabled={isSaving}
              style={{
                width:'100%',padding:'16px',borderRadius:12,border:'none',cursor:'pointer',
                fontFamily:T.mono,fontSize:11,fontWeight:700,
                letterSpacing:'3px',textTransform:'uppercase',
                background:isSaving?'#047857':ac,color:'#FFFFFF',transition:'all .2s'
              }}
            >
              {isSaving ? '✓ TREINO SALVO' : '↑ SALVAR TREINO'}
            </button>
            <div style={{textAlign:'center',marginTop:8,fontFamily:T.mono,fontSize:9,color:T.muted}}>
              {exercises.length} exercício{exercises.length!==1?'s':''} · zona {zone}
              {shared && <span style={{color:ac,marginLeft:6}}>· compartilhado</span>}
            </div>
          </div>
        )}
      </div>

      {showSearch && <ExerciseSearchModal onSelect={addExercise} onClose={() => setShowSearch(false)} />}
    </div>
  );
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// INSIGHT CARD — card individual (usado no carrossel em modo compacto/expandido)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function InsightCard({ insightData, expanded, onToggle }) {
  if (!insightData || !insightData.insights) return null;
  const { wkId, date, insights } = insightData;
  const { metrics, comparisons, messages } = insights;

  // Cor da zona ou fallback laranja
  const zoneColor = (() => {
    const z = insights.metrics && comparisons ? null : null; // não temos zone aqui diretamente
    return ZONE_COLORS['FORÇA'] || '#B45309'; // usa a cor do perfil fk como fallback
  })();
  const ac = '#B45309'; // insights são sempre do perfil fk por ora

  const DiffBadge = ({ diff }) => {
    if (!diff) return null;
    const sign  = diff > 0 ? '+' : '';
    const color = diff > 0 ? '#047857' : '#dc2626';
    return <span style={{fontFamily:T.mono,fontSize:7,color,marginLeft:3}}>{sign}{diff}%</span>;
  };

  const vol    = metrics.volume || 0;
  const volStr = vol >= 1000 ? (vol/1000).toFixed(1)+'k' : String(vol);

  return (
    <div
      onClick={onToggle}
      style={{
        borderRadius:12, border:`1px solid ${ac}30`, background:`${ac}07`,
        overflow:'hidden', cursor:'pointer', transition:'all .2s',
        flexShrink:0, width:'100%'
      }}
    >
      {/* Header sempre visível */}
      <div style={{
